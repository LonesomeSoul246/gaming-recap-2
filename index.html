  const cols = ["#33C3FF","#7C8CFF","#A97BFF","#14F0C8","#FFB547","#FFB547","#ffffff"];
  const P = Array.from({length:150}, () => ({x:W2/2 + (Math.random()-.5)*W2*.3, y:H2*.42, vx:(Math.random()-.5)*W2*.022, vy:-Math.random()*H2*.028-H2*.006,
    r:(4+Math.random()*6)*devicePixelRatio, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, va:(Math.random()-.5)*.3}));
  const t0 = performance.now();
  const tick = t => { const dt = t - t0; x.clearRect(0,0,W2,H2);
    for (const p of P){ p.vy += H2*.0009; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.c; x.globalAlpha = Math.max(0, 1 - dt/2600); x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); }
    if (dt < 2600) requestAnimationFrame(tick); else x.clearRect(0,0,W2,H2); };
  requestAnimationFrame(tick);
}

// Große Zahlen so verkleinern, dass sie nie über den Rand ragen (gemessen mit dem Endwert)
function wFit(root){
  root.querySelectorAll(".xl,.wbig,.wp-num").forEach(el=>{
    const keep = el.textContent, fin = el.dataset.count != null ? (el.dataset.pre||"") + num(Number(el.dataset.count)) : keep;
    const box = el.parentElement, cs = getComputedStyle(box), max = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (!(max > 0)) return;
    el.style.fontSize = "";
    // 1) Schätzung über die Zeichenzahl – unabhängig davon, ob die Schrift schon geladen ist
    const w = [...fin].reduce((s,ch)=> s + (/[.,]/.test(ch) ? .32 : ch==="~" ? .75 : ch===" " ? .3 : .68), 0);
    let fs = Math.min(parseFloat(getComputedStyle(el).fontSize), max / Math.max(1, w));
    el.style.fontSize = fs + "px";
    // 2) nachmessen
    el.textContent = ""; const sp = document.createElement("span"); sp.style.whiteSpace = "nowrap"; sp.textContent = fin; el.appendChild(sp);
    let guard = 0; while (sp.getBoundingClientRect().width > max + 1 && fs > 20 && guard++ < 40){ fs *= .94; el.style.fontSize = fs + "px"; }
    el.textContent = keep;
  });

/* Handy: Änderungen verschlüsselt nach GitHub schicken, der PC übernimmt sie */
let flushing = false;
async function flushEdits(){
  if (!CLOUD || flushing || !S.snap || !S.snap.gh) return;
  const q = edits().filter(e=>!e.sent); if (!q.length) return;
  flushing = true;
  try {
    const {repo, token, branch} = S.snap.gh, ts = Date.now();
    const body = await encryptObj({edits:q}, pass());
    const name = `edits/${ts}-${Math.random().toString(36).slice(2,8)}.enc`;
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${name}`, {method:"PUT",
      headers:{"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
      body: JSON.stringify({message:"Änderung vom Handy", content:btoa(unescape(encodeURIComponent(body))), branch})});
    if (r.ok){ const sent = new Set(q.map(e=>e.ts)); store.set("gr_edits", edits().map(e=>sent.has(e.ts)?{...e,sent:true}:e)); }
  } catch(e){ /* offline: später nochmal */ }
  finally { flushing = false; header(); }
}
window.addEventListener("online", flushEdits);
window.sendNow = async () => {
  await flushEdits();
  const left = edits().filter(e=>!e.sent).length;

/* Abend-Planer: Was passt in die Zeit, die ich heute habe? */
function evePlan(t){
  const out = [];
  for (const g of blGames()){
    if (SMAP[g.status].g !== "open" || !g.pc) continue;
    const rem = g.remaining, main = g.hltb && g.hltb.main;
    let sc = 0, why = "", tag = "";
    if (rem != null && rem > 0 && rem <= t * 1.1){ sc = 100 - rem/t*10; tag = "🏁 Heute durchspielbar"; why = `noch ca. ${hrs(rem)} bis zum Abspann`; }
    else if (g.status === "angefangen" && rem){ const p = Math.min(1, t/rem); sc = 45 + p*40; tag = "▶️ Gut weiterkommen"; why = `${num(p*100)} % vom Rest (${hrs(rem)}) schaffst du heute`; }
    else if (g.status === "als_naechstes"){ sc = 55; tag = "🎯 Als Nächstes"; why = main ? `Story ca. ${hrs(main)} – heute ${num(Math.min(1,t/main)*100)} % davon` : "steht bei dir als Nächstes"; }
    else if (!g.pcMinutes && main && main <= t*4){ sc = 35 + (g.critic||70)/10; tag = "⚡ Kurz & gut"; why = `ganze Story nur ${hrs(main)}`; }
    else continue;
    if (g.status === "als_naechstes") sc += 15;
    if (g.installed) sc += 8; else why += " · nicht installiert";
    if (g.last && Date.now() - g.last < 14*864e5) sc += 10;
    sc += (g.critic||0)/20;
    out.push({g, sc, why, tag});
  }
  return out.sort((a,b)=>b.sc-a.sc).slice(0,4);
}
function pickerPool(){
  return blGames().filter(g => (PK.pool==="open" ? SMAP[g.status].g==="open" : g.status===PK.pool)
    && (!PK.genre || g.genres.includes(PK.genre)) && (!PK.inst || g.installed)
    && (!PK.mood || MOODS[PK.mood](g)) && (!PK.len || (g.remaining!=null && (PK.len==="s" ? g.remaining<600 : PK.len==="m" ? g.remaining>=600&&g.remaining<1800 : g.remaining>=1800))));
}

  $("#pickerBody").innerHTML = `<button class="ibtn dclose" onclick="$('#picker').close()">✕</button><div class="pk">
    <div class="eyebrow">Was spiele ich als Nächstes?</div>

    <div class="opts">${[["open","Alles offen"],["als_naechstes","🎯 Als Nächstes"],["angefangen","▶️ Angefangen"],["ungespielt","📦 Nie gestartet"],["pausiert","⏸️ Pausiert"]].map(([k,l])=>chip(k,l,0,"pool")).join("")}</div>
    <div class="opts">${[["","Jede Stimmung"],["chill","😌 Entspannt"],["story","📖 Story-Abend"],["friends","👥 Mit Freunden"],["top","⭐ Top bewertet"]].map(([k,l])=>chip(k,l,0,"mood")).join("")}</div>
    <div class="opts">${[["","Jede Länge"],["s","⚡ Kurz (< 10 Std)"],["m","Mittel (10–30)"],["l","Lang (30+)"]].map(([k,l])=>chip(k,l,0,"len")).join("")}</div>
    <div class="opts"><select onchange="PK.genre=this.value;PK.pick=null;renderPicker()"><option value="">Alle Genres</option>${genres.map(x=>`<option ${PK.genre===x?"selected":""}>${esc(x)}</option>`).join("")}</select>
      <label class="check" style="margin:0"><input type="checkbox" ${PK.inst?"checked":""} onchange="PK.inst=this.checked;PK.pick=null;renderPicker()"> nur installierte</label></div>
    <div class="acts"><button class="btn limeb" id="roll" ${pool.length?"":"disabled"}>🎲 ${g?"Nochmal":"Würfeln"}</button>

      ${g ? `<button class="btn ghost" onclick="$('#picker').close();openGame('${esc(g.key)}')">Details</button>`:""}</div></div>`;
  $("#roll").onclick = roll;
}
function pickWhy(g){
  const bits = [];
  if (g.added) bits.push(`liegt seit ${fdate(g.added)} im Regal`);
  bits.push(g.pcMinutes ? `${hrs(g.pcMinutes)} gespielt` : "noch nie gestartet");
  if (g.remaining) bits.push(`noch ca. ${hrs(g.remaining)}`);
  return esc(bits.join(" · "));
}
function roll(){

    $("#slot").innerHTML = `<div class="poster">${img(g.covers,g.title)}</div>`;

async function saveNotify(P){
  try { await saveKv("notify", P); S.data.notify = P; toast("Gespeichert"); } catch(e){ toast("Speichern fehlgeschlagen"); }
  const box = $("#notifyBox"); if (box) box.innerHTML = notifyBlock();
}
window.setNotify = (path, val) => {
  const P = JSON.parse(JSON.stringify(S.data.notify || {cats:{}, win:true, phone:true}));
  P.cats = P.cats || {};
  if (path.startsWith("cats.")) P.cats[path.slice(5)] = val; else P[path] = val;
  for (const [k] of NCATS) if (!(k in P.cats)) P.cats[k] = true;
  saveNotify(P);
};
window.setQuiet = on => {
  const P = JSON.parse(JSON.stringify(S.data.notify || {cats:{}, win:true, phone:true}));
  if (on === false) delete P.quiet;
  else if (on === true) P.quiet = [22, 8];
  else { const a = Number($("#qFrom").value), b = Number($("#qTo").value); if (a === b){ toast("Start und Ende müssen verschieden sein"); return; } P.quiet = [a, b]; }
  P.cats = P.cats || {}; for (const [k] of NCATS) if (!(k in P.cats)) P.cats[k] = true;
  saveNotify(P);
};

async function post(url, body){
  const r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ("Fehler " + r.status));
  return j;
}

      <div class="help"><ol><li>Auf <a href="https://www.playstation.com" target="_blank" rel="noopener">playstation.com</a> anmelden.</li>
      <li>Im selben Browser <a href="https://ca.account.sony.com/api/v1/ssocookie" target="_blank" rel="noopener">diesen Link</a> öffnen.</li>
      <li>Den Wert hinter <code>"npsso"</code> einfügen.</li></ol>Wie ein Passwort behandeln. Hält ca. 2 Monate.</div>
    </fieldset>
    <fieldset><legend>Xbox Series X</legend>
      <p class="help" style="margin-top:0"><b>Nicht nötig:</b> Deine Xbox-Spiele kommen über Playnite (Xbox-Bibliothek). Den Key brauchst du nur, wenn Playnite keine Xbox-Spiele liefert.</p>
      ${c.xbox_api_key_set?`<label class="check"><input type="checkbox" id="xbox_api_key_clear"> Gespeicherten OpenXBL-Key löschen</label>`:""}
      <label>OpenXBL-API-Key</label><input type="password" id="xbox_api_key" placeholder="${ph2(c.xbox_api_key_set)}" autocomplete="off">
      <div class="help"><ol><li>Auf <a href="https://xbl.io" target="_blank" rel="noopener">xbl.io</a> mit deinem Microsoft-Konto anmelden.</li>
      <li>Unter „API Keys“ einen Key erstellen und hier einfügen.</li></ol>Drittanbieter-Dienst. Spielzeiten kommen in Portionen.</div>
    </fieldset>
    <fieldset><legend>Sonstiges</legend>
      <label>Automatisch abgleichen alle … Stunden</label><input type="number" id="sync_hours" min="1" max="48" value="${c.sync_hours}">
      <label class="check" style="margin-top:14px"><input type="checkbox" id="lan" ${c.lan?"checked":""}> Zusätzlich im Heim-WLAN freigeben</label>
      <div class="help">Brauchst du mit der Handy-App eigentlich nicht mehr. Wirkt nach einem Neustart.</div>
    </fieldset>
    </details>
    <fieldset><legend>📚 Backlog</legend>
      <div class="help" style="margin-top:0">Welche PC-Stores zählen in deinen Backlog? Konsolen und geliehene Spiele sind nie dabei.</div>
      ${[...new Set([...DEFAULT_BL_STORES, ...S.data.games.filter(g=>g.device==="PC").map(g=>g.store)])].map(st=>`<label class="check" style="margin-top:8px"><input type="checkbox" class="blstore" value="${esc(st)}" ${backlogStores().includes(st)?"checked":""}> ${esc(st)}</label>`).join("")}
    </fieldset>
    <fieldset><legend>📲 Push aufs Handy</legend>
      <div class="help" style="margin-top:0">Hinweise (Angebote, Gratis-Spiele, Releases, Wochen- und Monats-Recap) kommen zusätzlich aufs Handy – über den kostenlosen Dienst <b>ntfy</b>, ohne Konto.</div>
      <ol class="help"><li>App <b>ntfy</b> installieren (<a href="https://play.google.com/store/apps/details?id=io.heckel.ntfy" target="_blank" rel="noopener">Android</a> / <a href="https://apps.apple.com/app/ntfy/id1625396347" target="_blank" rel="noopener">iPhone</a>).</li>
        <li>Hier ein Thema erzeugen, speichern, dann in ntfy auf „+“ und genau dieses Thema abonnieren.</li>
        <li>„Test senden“ drücken.</li></ol>
      <label>Thema (wie ein Passwort – nicht weitergeben)</label>
      <div class="inl"><input type="text" id="push_topic" value="${esc(c.push_topic||"")}" autocomplete="off" style="flex:1">
        <button class="btn ghost small" type="button" onclick="$('#push_topic').value='gr-'+crypto.getRandomValues(new Uint32Array(3)).join('').slice(0,22)">Erzeugen</button>
        <button class="btn ghost small" type="button" onclick="post('/api/push/test',{topic:$('#push_topic').value}).then(()=>toast('Test gesendet')).catch(e=>alert(e.message))">Test senden</button></div>
    </fieldset>
    <fieldset><legend>🔔 Benachrichtigungen</legend><div id="notifyBox">${notifyBlock()}</div></fieldset>
    <fieldset><legend>🔔 Extras & Hinweise</legend>
      ${c.autostart_supported?`<label class="check" style="margin-bottom:10px"><input type="checkbox" id="autostartChk" ${c.autostart?"checked":""} onchange="setAutostart(this)"> Mit Windows starten (minimiert) – damit keine Tage fehlen</label>`:""}
      <label class="check"><input type="checkbox" id="steam_extras" ${c.steam_extras?"checked":""}> Steam-Erfolge, Wunschliste, Preise und Freunde laden</label>
      <label>Leistung deines PCs beim Zocken (Watt, für die Stromrechnung)</label><input type="number" id="watts" min="50" max="2000" value="${c.watts||350}">
      <label>Strompreis (€ pro kWh)</label><input type="number" id="kwh_price" min="0" max="5" step="0.01" value="${c.kwh_price||0.35}">
    </fieldset>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" type="button" onclick="$('#settings').close()">Abbrechen</button>
      <button class="btn limeb" type="button" id="saveBtn">Speichern</button></div>`;
  $("#instBtn").onclick = async () => {
    try { const r = await post("/api/playnite/install",{}); alert("Installiert nach:\n" + r.path + "\n\nStarte Playnite jetzt neu."); openSettings(); }
    catch(e){ alert(e.message); }
  };
  if ($("#restoreBtn")) $("#restoreBtn").onclick = async () => {
    if (!confirm("Backup aus dem Repository laden? Es wird nur ergänzt, was hier fehlt.")) return;
    try { const r = await post("/api/backup/restore",{}); toast(`${r.restored} Einträge wiederhergestellt`); setTimeout(load, 500); }
    catch(e){ alert(e.message); }
  };
  if ($("#pushBtn")) $("#pushBtn").onclick = async () => { await post("/api/cloud/push",{}); toast("Lade hoch …"); setTimeout(openSettings, 8000); };
  $("#saveBtn").onclick = async () => {
    $("#saveBtn").disabled = true;
    try {
      const v = id => $("#"+id).value, ch = id => $("#"+id).checked;
      await post("/api/config", {steam_api_key:v("steam_api_key"), steam_id:v("steam_id"), psn_npsso:v("psn_npsso"), xbox_api_key:v("xbox_api_key"), xbox_api_key_clear: !!($("#xbox_api_key_clear")||{}).checked,
        playnite_export:v("playnite_export"), gh_repo:v("gh_repo"), igdb_client_id:v("igdb_client_id"), igdb_client_secret:v("igdb_client_secret"), itad_key:v("itad_key"), sgdb_key:v("sgdb_key"), rawg_key:v("rawg_key"),
        user_name:v("user_name"), partner_url:v("partner_url"), partner_code:v("partner_code"), prices_steam_only:ch("prices_steam_only"),
        ...($("#auto_update")?{auto_update:ch("auto_update")}:{}), ...($("#publish_updates")?{publish_updates:ch("publish_updates")}:{}), gh_token:v("gh_token"), cloud_pass:v("cloud_pass"),
        cloud_enabled:ch("cloud_enabled"), tracker:ch("tracker"), hltb:ch("hltb"), lan:ch("lan"), sync_hours:Number(v("sync_hours"))||6,
        backlog_stores:[...document.querySelectorAll(".blstore:checked")].map(e=>e.value),
        steam_extras:ch("steam_extras"), push_topic:v("push_topic"),
        watts:Number(v("watts"))||350, kwh_price:Number(v("kwh_price"))||0.35});
      $("#settings").close(); toast("Gespeichert"); setTimeout(load,400);
    } catch(e){ alert("Speichern fehlgeschlagen: " + e.message); $("#saveBtn").disabled = false; }
  };
  if (!$("#settings").open) $("#settings").showModal();
  pollDownloads(); loadUpdBox();
};
async function loadUpdBox(){
  const box = $("#updBox"); if (!box) return;
  try {
    const u = await (await fetch("/api/update", {cache:"no-store"})).json();
    const when = t => t ? new Date(t*1000).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"}) : "noch nie";
    box.innerHTML = `<p style="margin:0 0 8px"><b>Version ${esc(u.version)}</b> <span class="help" style="margin:0">· Stand ${esc(u.release)}</span></p>` + (u.source ? `
      <p class="help" style="margin:0">Updates kommen automatisch von <code>${esc(u.source)}</code>. Zuletzt geprüft: ${when(u.last_check)}${u.latest?` · neuester Stand ${esc(u.latest)}`:""}.</p>
      ${u.error?`<p class="bad" style="font-weight:700">${esc(u.error)}</p>`:""}${u.deferred?`<p class="help">Ein Update wartet – es wird installiert, sobald kein Spiel mehr läuft.</p>`:""}
      ${u.latest && u.latest !== u.release ? `<p style="color:var(--lime);font-weight:800">Neues Update verfügbar.</p>` : u.latest ? `<p class="help">✓ Du bist auf dem neuesten Stand.</p>` : ""}
      <label class="check"><input type="checkbox" id="auto_update" ${u.auto?"checked":""}> Updates automatisch installieren</label>
      <div class="inl" style="gap:8px;margin-top:8px"><button class="btn ghost small" type="button" onclick="post('/api/update/check',{}).then(()=>{toast('Prüfe …');setTimeout(loadUpdBox,5000)})">Jetzt prüfen</button>
        ${u.latest && u.latest !== u.release ? `<button class="btn limeb small" type="button" onclick="post('/api/update/check',{apply:true}).then(()=>{toast('Installiere Update …');setTimeout(()=>sysWait(),3000)})">Jetzt aktualisieren</button>` : ""}</div>`
      : `<label class="check"><input type="checkbox" id="publish_updates" ${u.publisher?"checked":""}> Updates für andere bereitstellen (über deine Handy-App-Adresse)</label>
      <p class="help">${u.publisher ? (u.published ? `Veröffentlicht: Stand ${esc(u.published)}${u.published===u.release?" ✓ aktuell":" – wird beim nächsten Upload aktualisiert"}.` : "Wird beim nächsten Upload veröffentlicht.") : "Nur Programmdateien, keine Keys und keine Daten. Andere Installationen holen sich Updates dann einmal am Tag."}</p>`);
  } catch(e){ box.innerHTML = `<p class="help">Update-Status nicht abrufbar.</p>`; }
}
window.sysWait = async () => {
  const t0 = Date.now(); await new Promise(r=>setTimeout(r, 3000));
  while (Date.now() - t0 < 120000){ try { const r = await fetch("/api/config", {cache:"no-store"}); if (r.ok){ location.reload(); return; } } catch(e){} await new Promise(r=>setTimeout(r, 2000)); }
};
const dlFile = (name, text) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type:"text/plain"})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
window.downloadReport = async () => {
  try { const j = await (await fetch("/api/report")).json(); dlFile(`gaming-recap-fehlerbericht-${new Date().toISOString().slice(0,10)}.txt`, j.text); toast("Fehlerbericht gespeichert – ohne Keys und ohne Spieldaten"); }
  catch(e){ toast("Ging nicht: " + e.message); }
};
window.exportKeys = async () => {
  const pw = prompt("Passwort für die Keys-Datei (mind. 8 Zeichen). Sag es der anderen Person getrennt – nicht in derselben Nachricht wie die Datei.");
  if (!pw) return;
  try { const j = await post("/api/keys/export", {password: pw}); dlFile("gaming-recap-keys.grkeys", j.file); toast(`${j.count} Keys exportiert`); }
  catch(e){ alert(e.message); }
};
window.importKeys = (after) => {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".grkeys,.txt";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return; const text = await f.text();
    const pw = prompt("Passwort der Keys-Datei:"); if (!pw) return;
    try { const j = await post("/api/keys/import", {file: text, password: pw}); toast(`${j.imported.length} Keys übernommen`); if (after) after(j); else openSettings(); }
    catch(e){ alert(e.message); }
  };
  inp.click();
};

/* ================= Start ================= */
if (CLOUD && "serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(reg => {
    reg.update().catch(()=>{});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{});
  // Neue Version installiert -> Hinweis zum Neuladen
  let hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadCtrl){ hadCtrl = true; return; }
    const b = document.createElement("button"); b.className = "updbar"; b.textContent = "✨ Neue Version verfügbar – tippen zum Laden";
    b.onclick = () => location.reload(); document.body.appendChild(b);
  });
}
nav();
load();
if (LOCAL) setInterval(()=>{ if (!document.hidden && cur()!=="wrapped") fetch("/api/data?period="+S.period).then(r=>r.json()).then(d=>{
  const changed = JSON.stringify(d.playing) !== JSON.stringify(S.data && S.data.playing) || d.last_sync !== (S.data && S.data.last_sync);
  if (changed && !$("#detail").open && !$("#picker").open && !$("#settings").open) load(true);
}).catch(()=>{}); }, 60000);
</script>
</body>
</html>
