<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recap">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Gaming Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101216; --ink:#F1F5FA; --muted:#A3ADBD; --line:#ffffff12; --glass:#ffffff09; --panel:#181B21; --panel2:#1F232A;
  --acc:#33C3FF; --acc-ink:#0A1C2A; --lime:#33C3FF; --pink:#7C8CFF; --violet:#A97BFF; --cyan:#14F0C8; --orange:#FFB547; --blue:#4C7DFF; --yellow:#FFB547;
  --r:24px; --font:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
body{min-height:100vh;overflow-x:hidden}
a{color:var(--cyan)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:#ffffff0f;border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--violet)}
select option{background:#181B21}
code{background:#ffffff12;padding:1px 6px;border-radius:6px;font-size:.92em}

/* ---------- Kopf & Navigation ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(12px + var(--top)) 18px 12px;
  background:linear-gradient(#101216f5,#101216c0 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;white-space:nowrap}
.logo b{background:linear-gradient(90deg,var(--lime),var(--cyan) 45%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.spacer{flex:1}
.sync{font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;flex:none;position:relative}
.ibtn:hover{border-color:#ffffff40}
.ibtn svg{width:19px;height:19px}
.ibtn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.deskNav{display:none;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px;margin-left:18px}
.deskNav a{padding:8px 16px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600}
.deskNav a.on{background:var(--ink);color:var(--bg)}
.tabbar{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:30;display:flex;
  background:#1A1D24e8;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:5px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:18px;
  color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:700}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{color:var(--bg);background:var(--ink)}
@media(min-width:1000px){.tabbar{display:none}.deskNav{display:flex}}
.playing{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:18px;background:#33C3FF18;border:1px solid #33C3FF44;margin-bottom:14px;font-weight:700}
.playing i{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 #33C3FFaa;animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px #33C3FF00}100%{box-shadow:0 0 0 0 #33C3FF00}}

main{max-width:1240px;margin:0 auto;padding:4px 16px 120px}
@media(min-width:1000px){main{padding:8px 28px 60px}}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.75}
.h1{font-size:clamp(30px,7vw,52px);font-weight:900;letter-spacing:-1.5px;line-height:1;margin:6px 0 18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.6;margin-left:4px}

/* ---------- Bento ---------- */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{grid-column:span 12;border-radius:var(--r);padding:24px;position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
@media(min-width:1000px){.s7{grid-column:span 7}.s5{grid-column:span 5}.s6{grid-column:span 6}.s4{grid-column:span 4}.s8{grid-column:span 8}.s3{grid-column:span 3}}
@media(min-width:640px) and (max-width:999px){.m6{grid-column:span 6}}
.card h3{margin:0 0 16px;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.8}
.reveal{opacity:0;transform:translateY(24px) scale(.98);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

.hero{min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;border:0;
  background:radial-gradient(60% 80% at 15% 20%,#7C8CFF 0,transparent 60%),radial-gradient(50% 70% at 85% 10%,#A97BFF 0,transparent 60%),
  radial-gradient(60% 80% at 70% 100%,#FFB547 0,transparent 60%),#14122A;background-size:140% 140%;animation:mesh 14s ease-in-out infinite alternate}
@keyframes mesh{0%{background-position:0% 0%}100%{background-position:100% 100%}}
.hero .num{font-size:clamp(84px,24vw,210px);font-weight:900;line-height:.85;letter-spacing:-.06em;margin:10px 0 2px}
.hero .unit{font-size:clamp(22px,5vw,34px);font-weight:800;letter-spacing:-.5px}
.hero .sub{margin-top:10px;font-size:16px;opacity:.9;max-width:560px}
.hstats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.hstat{background:#0000002e;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:18px;padding:10px 16px}
.hstat b{font-size:22px;font-weight:900;display:block;line-height:1.1}
.hstat span{font-size:12px;opacity:.8}

.topg{min-height:340px;padding:0;display:flex;align-items:flex-end;border:0;cursor:pointer}
.topg .bgimg{position:absolute;inset:0}
.topg .bgimg img,.topg .bgimg .ph{width:100%;height:100%;object-fit:cover}
.topg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#101216 5%,#101216aa 45%,transparent 80%)}
.topg .in{position:relative;z-index:1;padding:26px;width:100%}
.topg .rank1{position:absolute;right:16px;top:10px;z-index:2;font-size:110px;font-weight:900;line-height:1;color:#fff;letter-spacing:-6px;
  text-shadow:4px 4px 0 #000,0 10px 40px #000c}
.topg .t{font-size:clamp(26px,5vw,40px);font-weight:900;letter-spacing:-1px;line-height:1.05;margin:6px 0 8px}

.lime{background:var(--lime);color:#111;border:0}
.pinkc{background:var(--pink);color:#160411;border:0}
.cyanc{background:var(--cyan);color:#04201d;border:0}
.violetc{background:var(--violet);color:#fff;border:0}
.orangec{background:var(--orange);color:#200c00;border:0}
.yellowc{background:var(--yellow);color:#1d1600;border:0}
.big{font-size:clamp(56px,12vw,96px);font-weight:900;letter-spacing:-.05em;line-height:.9}
.mid{font-size:clamp(34px,7vw,52px);font-weight:900;letter-spacing:-1.5px;line-height:1}
.devrow{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700}
.devrow .lbl{width:100px}
.devrow .trk{flex:1;height:14px;border-radius:999px;background:#00000022;overflow:hidden}
.devrow .trk div{height:100%;border-radius:999px;background:#111;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.devrow .v{width:80px;text-align:right}

.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0 4px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{display:none}
.rk{flex:none;display:flex;align-items:flex-end;scroll-snap-align:start;cursor:pointer;padding:0 0 46px 26px;position:relative}
.rk .n{position:absolute;left:0;bottom:40px;z-index:2;font-size:70px;font-weight:900;line-height:.8;color:#fff;letter-spacing:-4px;
  text-shadow:3px 3px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 8px 24px #000;pointer-events:none}
@media(min-width:1000px){.rk .n{font-size:96px}.rk{padding-left:32px}}
.rk .p{width:130px;position:relative;z-index:1}
@media(min-width:1000px){.rk .p{width:150px}}
.poster{aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:#1F232A;position:relative;box-shadow:0 10px 30px #0008}
.poster img,.poster .ph{width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{display:flex}
.rk .meta{position:absolute;top:100%;left:0;right:0;font-size:13px;margin-top:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .meta span{display:block;color:var(--muted);font-weight:600}
.ph{display:flex;align-items:flex-end;padding:12px;font-weight:900;font-size:16px;line-height:1.1;color:#fff;letter-spacing:-.3px}

.pbar{display:flex;align-items:center;gap:12px;padding:9px 0}
.pbar .dot{width:12px;height:12px;border-radius:50%;flex:none}
.pbar .nm{width:110px;font-weight:700;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .trk{flex:1;height:10px;border-radius:999px;background:#ffffff10;overflow:hidden}
.pbar .trk div{height:100%;border-radius:999px;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.pbar .v{width:76px;text-align:right;font-weight:700;font-size:14px}
.inv .trk{background:#00000020}.inv .trk div{background:#160411}

.cols{display:flex;align-items:flex-end;gap:10px;height:170px;margin-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.cols .c div{width:100%;border-radius:12px 12px 4px 4px;background:#04201d;transition:height 1.2s cubic-bezier(.2,.7,.2,1);min-height:4px}
.cols .c span{font-size:12px;font-weight:800}
.cols.thin{gap:3px}.cols.thin .c div{border-radius:6px 6px 2px 2px}.cols.thin .c span{font-size:10px}

.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fact{all:unset;box-sizing:border-box;cursor:pointer;border-radius:20px;padding:16px 16px 14px;min-height:150px;display:flex;flex-direction:column;
  background:linear-gradient(160deg,color-mix(in srgb,var(--a) 16%,#181B21),#13111a 70%);border:1px solid color-mix(in srgb,var(--a) 28%,transparent);transition:transform .2s,border-color .2s}
.fact:hover{transform:translateY(-3px);border-color:var(--a)}
.fact .ft{display:flex;align-items:center;gap:8px}
.fact .ft i{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 22%,transparent);font-size:16px}
.fact small{font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--a)}
.fact b{font-size:24px;font-weight:900;letter-spacing:-.6px;line-height:1.1;margin:auto 0 4px;padding-top:12px;word-break:break-word;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fact span{font-size:13px;color:#ffffffb8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fact em{font-style:normal;font-size:10.5px;font-weight:800;margin-top:10px;align-self:flex-start;padding:2px 8px;border-radius:999px;background:#ffffff10;color:#ffffff99}
.xrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid #ffffff10;cursor:pointer}
.xrow:first-child{border-top:0}.xrow .poster{width:40px;border-radius:8px}
.xrow b{display:block;font-size:14.5px}.xrow span{font-size:12.5px;color:var(--muted)}.xrow em{font-style:normal;font-weight:900;white-space:nowrap}
.calc{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 12px;font-weight:900;color:var(--muted)}
.calc>div:has(small){background:#ffffff0b;border-radius:12px;padding:8px 12px;color:var(--ink)}
.calc small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.calc b{font-size:17px}

.ring{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--lime) calc(var(--p)*1%),#ffffff1a 0)}
.ring>div{width:118px;height:118px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
.violetc .ring>div{background:var(--violet)}
.ring b{font-size:34px;font-weight:900;line-height:1}
.ring span{font-size:11px;opacity:.75;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:999px;font-weight:800;font-size:15px;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line)}
.btn.limeb{background:var(--lime);color:#111}
.btn.small{padding:9px 14px;font-size:13.5px}
.btn:disabled{opacity:.5}
.notice{border-radius:20px;padding:14px 18px;background:#ffffff0d;border:1px solid var(--line);margin-bottom:14px;font-size:14px}
.stat3{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:1000px){.stat3{grid-template-columns:repeat(4,1fr)}}
.tile{border-radius:22px;padding:18px;background:var(--panel);border:1px solid var(--line)}
.tile small{display:block;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.tile b{display:block;font-size:30px;font-weight:900;letter-spacing:-1px;margin-top:6px;line-height:1.05}
.tile span{font-size:13px;color:var(--muted)}

/* ---------- Heatmap ---------- */
.heat i.co.l1{background:#A97BFF40}.heat i.co.l2{background:#A97BFF70}.heat i.co.l3,.legend i.co{background:#A97BFFa8}.heat i.co.l4{background:#A97BFF}
.heat i.ap,.legend i.ap{background-image:repeating-linear-gradient(135deg,#0000 0 2px,#0008 2px 4px)}
.legend i.co,.legend i.ap{width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:4px}
.heatwrap{overflow-x:auto;scrollbar-width:thin;padding-bottom:6px}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;width:max-content}
.heat i{border-radius:3px;background:#ffffff0d}
.heat i.l1{background:#33C3FF40}.heat i.l2{background:#33C3FF70}.heat i.l3{background:#33C3FFa8}.heat i.l4{background:#33C3FF}
.heat i.x{background:transparent}
.months{display:grid;grid-auto-flow:column;grid-auto-columns:16px;font-size:11px;color:var(--muted);width:max-content;margin-bottom:6px}
@media(min-width:1000px){.heat{grid-template-rows:repeat(7,17px);grid-auto-columns:17px;gap:4px}.months{grid-auto-columns:21px}}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- Bibliothek ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input[type=search],.toolbar input[type=text]{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media(min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.gcard{cursor:pointer}
.gcard .poster::after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(0deg,#000d,transparent)}
.gcard .ov{position:absolute;left:12px;right:12px;bottom:10px;z-index:1}
.gcard .ov b{display:block;font-size:20px;font-weight:900;letter-spacing:-.5px}
.gcard .dev{position:absolute;top:10px;right:10px;z-index:1;display:flex;gap:4px}
.gcard .dev i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #0008}
.gcard .nm{margin-top:8px;font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .poster{transition:transform .2s}
.gcard:hover .poster{transform:translateY(-4px)}

/* ---------- Backlog ---------- */
.bl-layout{display:block}
.bl-aside .card{margin-bottom:14px}
.bl-filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 14px}
.bl-filters::-webkit-scrollbar{display:none}
@media(min-width:1000px){
  .bl-layout{display:grid;grid-template-columns:330px 1fr;gap:24px;align-items:start}
  .bl-aside{position:sticky;top:84px}
  .bl-filters{flex-direction:column;overflow:visible;gap:4px}
  .bl-filters .chip{border-radius:14px;display:flex;justify-content:space-between;background:transparent;border-color:transparent}
  .bl-filters .chip.on{background:var(--ink)}
  .bl-filters .chip:not(.on):hover{background:var(--glass)}
}
.bhero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.bhero .nums{display:flex;gap:22px;flex-wrap:wrap}
.bhero .nums b{font-size:34px;font-weight:900;display:block;line-height:1}
.bhero .nums span{font-size:12px;opacity:.75;font-weight:700}
.brow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;padding:10px;border-radius:18px;cursor:pointer}
.brow:hover{background:#ffffff08}
.brow .poster{width:52px;border-radius:10px;box-shadow:none}
.brow .ph,.rk .ph{font-size:0}
.brow .mid2{min-width:0}
.brow .mid2 b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .mid2 b .mc{height:22px;min-width:28px;font-size:12.5px;border-radius:7px;margin-right:8px;vertical-align:1px}
.brow .mid2 span{font-size:13px;color:var(--muted)}
.brow .cd{display:none;color:var(--muted);font-size:14px;font-weight:600;text-align:right}
.bhead{display:none}
@media(min-width:1000px){
  .brow{grid-template-columns:52px 1fr 150px 90px 90px 90px}
  .brow .cd{display:block}
  .bhead{display:grid;grid-template-columns:52px 1fr 150px 90px 90px 90px;gap:14px;padding:0 10px 8px;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
  .bhead span:nth-child(n+4){text-align:right}
}
.ab-bar{height:8px;border-radius:8px;background:#ffffff14;overflow:hidden;margin:4px 0 16px}.ab-bar div{height:100%;background:linear-gradient(90deg,var(--lime),#14F0C8)}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 10px}
.medal{text-align:center;cursor:pointer}
.medal .ring{width:76px;height:76px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:34px;
  background:radial-gradient(circle at 30% 25%,#ffffff40,transparent 55%),conic-gradient(from 200deg,var(--c),#ffffff30,var(--c));
  box-shadow:0 10px 30px -10px var(--c),inset 0 0 0 3px #0006;transition:transform .2s}
.medal .ring span{font-size:32px;line-height:1;width:60px;height:60px;border-radius:50%;background:#16191F;display:grid;place-items:center}
.medal:hover .ring{transform:translateY(-3px) rotate(-4deg)}
.medal b{display:block;font-size:12.5px;line-height:1.2}
.lrow{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #ffffff10}
.lrow:first-of-type{border-top:0}
.lrow .le{width:42px;height:42px;border-radius:50%;background:#ffffff0d;display:grid;place-items:center;font-size:20px;filter:grayscale(.7);opacity:.8}
.lrow .lm b{display:block;font-size:14.5px}.lrow .lm span{font-size:12.5px;color:var(--muted)}
.lrow .pr{height:5px;border-radius:5px;background:#ffffff12;margin-top:6px;overflow:hidden}.lrow .pr div{height:100%;background:var(--lime)}

/* ================= Design G5: Graphit, Himmelblau, Türkis, Violett ================= */
html,body{background:radial-gradient(1200px 520px at 50% -120px,#242B37 0%,#101216 60%) fixed,#101216}

  -webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}

<script>
"use strict";
/* ================= Modus ================= */
// Lokal (PC oder Heim-WLAN): Daten kommen vom Server. Sonst: Handy-App auf GitHub Pages mit verschlüsselter Kopie.
const LOCAL = ["localhost","127.0.0.1"].includes(location.hostname) || /^\d+\.\d+\.\d+\.\d+$/.test(location.hostname);
const CLOUD = !LOCAL;

/* ================= Konstanten ================= */
const PLAT_COLORS = {"Steam":"#66c0f4","Epic Games":"#e9e9e9","Ubisoft":"#FFB547","EA":"#ff4f6d","GOG":"#A97BFF",
  "Xbox PC":"#14F0C8","Battle.net":"#00b4ff","Amazon":"#FFB547","itch.io":"#fa5c5c","Humble":"#d94848","Rockstar":"#FFB547",
  "PlayStation":"#3d7bff","Xbox":"#14F0C8","Nintendo":"#ff3b3b","Andere":"#8a93a6"};
const DEV_COLORS = {"PC":"#33C3FF","PlayStation":"#3d7bff","Xbox":"#14F0C8","Nintendo":"#ff3b3b"};
const pcolor = p => PLAT_COLORS[p] || PLAT_COLORS.Andere;
const STATUS = [
  {k:"als_naechstes", l:"Als Nächstes", e:"🎯", c:"#33C3FF", g:"open"},
  {k:"angefangen",    l:"Angefangen",   e:"▶️", c:"#14F0C8", g:"open"},
  {k:"pausiert",      l:"Pausiert",     e:"⏸️", c:"#FFB547", g:"open"},
  {k:"ungespielt",    l:"Ungespielt",   e:"📦", c:"#a19eb6", g:"open"},
  {k:"durchgespielt", l:"Durchgespielt",e:"🏁", c:"#A97BFF", g:"done"},
  {k:"komplett",      l:"100 %",        e:"🏆", c:"#7C8CFF", g:"done"},
  {k:"abgebrochen",   l:"Abgebrochen",  e:"🪦", c:"#FFB547", g:"out"},
  {k:"endlos",        l:"Endlos / Multiplayer", e:"♾️", c:"#66c0f4", g:"out"},
  {k:"ignoriert",     l:"Kein Interesse", e:"🙈", c:"#5b586b", g:"out"},
];
const SMAP = Object.fromEntries(STATUS.map(s=>[s.k,s]));
const WD = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const ICONS = {
  friends:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.5.2 4.3 1.9 5 5"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10l8-6 8 6v10"/><path d="M9 20v-6h6v6"/></svg>',
  lib:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 4h14v16l-7-4-7 4z"/></svg>',
  act:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  wrap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>',
};
const ROUTES = [["uebersicht","Übersicht","home"],["spiele","Spiele","lib"],["backlog","Backlog","back"],["statistik","Statistik","act"],["freunde","Freunde","friends"],["wrapped","Wrapped","wrap"]];

/* ================= Helfer ================= */
const S = {data:null, snap:null, period:"all", groups:[], gmap:new Map(),
  lib:{q:"",dev:"",sort:"min",limit:60,played:false}, bl:{f:"open",sort:"added",limit:80}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (n,d=0) => Number(n).toLocaleString("de-DE",{maximumFractionDigits:d,minimumFractionDigits:d});
// S.est: gerade wird ein geschätzter Zeitraum gezeichnet -> Zeiten mit "~"
function hrs(min){ const t = S.est ? "~" : ""; if (min < 60) return `${t}${Math.round(min)} Min`; const h=min/60; return `${t}${num(h, h<10?1:0)} Std`; }
function pdate(s){ if(!s) return null; const d=new Date(String(s).replace(" ","T").replace(/(\.\d{3})\d+/,"$1")); return isNaN(d)||d.getFullYear()<1990?null:d; }
const fdate = d => d ? d.toLocaleDateString("de-DE",{day:"numeric",month:"short",year:"numeric"}) : "–";
// Muss identisch zu norm_title()/PLATFORM_SUFFIX in common.py bleiben
const PLATFORM_SUFFIX = /\((?:playstation ?[45]|ps[45]|xbox one|xbox series x ?\| ?s|windows|pc)\)|\b(?:for )?xbox series x ?\| ?s\b|\bxbox one edition\b|-\s*windows(?: 10)?(?: edition)?\b|\bpc edition\b|\bfor windows 10\b|\bstandard edition\b/g;
const EDITION_SUFFIX = / (?:enhanced(?: edition)?|definitive edition|game of the year(?: edition)?|goty(?: edition)?|remastered|complete edition|deluxe edition|ultimate edition|gold edition|special edition|anniversary edition|director s cut|(?:the )?final cut)$/;
const norm = t => { const x = String(t||"").replace(/[™®©℠]/g," ").replace(/[‘’‛′´`]/g,"'").normalize("NFKD").replace(/[^\x00-\x7f]/g,"").toLowerCase().replace(PLATFORM_SUFFIX," ").replace(/[^a-z0-9]+/g," ").trim(); return x.replace(EDITION_SUFFIX,"").trim() || x; };
function hash(s){ let h=0; for (const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
const PH_GRADS = [["#7C8CFF","#A97BFF"],["#33C3FF","#14F0C8"],["#FFB547","#7C8CFF"],["#3d7bff","#14F0C8"],["#A97BFF","#3d7bff"],["#FFB547","#FFB547"]];
function ph(title){ const [a,b]=PH_GRADS[hash(title)%PH_GRADS.length]; return `<div class="ph" style="background:linear-gradient(140deg,${a},${b})">${esc(title)}</div>`; }
function img(srcs, title){
  srcs = (srcs||[]).filter(Boolean);
  if (!srcs.length) return ph(title);
  return `<img loading="lazy" decoding="async" alt="" src="${esc(srcs[0])}" data-fb="${esc(srcs.slice(1).join("|"))}" data-t="${esc(title)}" onerror="imgFail(this)">`;
}
window.imgFail = el => {
  const fb = (el.dataset.fb||"").split("|").filter(Boolean);
  if (fb.length){ el.dataset.fb = fb.slice(1).join("|"); el.src = fb[0]; }
  else el.outerHTML = ph(el.dataset.t||"");
};
const cleanTitle = t => String(t||"").replace(/\s*\((?:PlayStation\s?®?\s?[45]|PS[45]|Xbox One|Xbox Series X\s?\|\s?S|Windows|PC)\)/gi,"")
  .replace(/\s+(?:for\s+)?Xbox Series X\s?\|\s?S\b/gi,"").replace(/\s*-\s*Windows(?: 10)?(?: Edition)?$/i,"").replace(/\s*-\s*PC Edition$/i,"")
  .replace(/[™®](?=\w)/g," ").replace(/[™®]/g,"").replace(/\s{2,}/g," ").trim();
const mcClass = v => v >= 75 ? "g" : v >= 50 ? "y" : "r";
const mcBadge = (v, cls="") => v ? `<span class="mc ${mcClass(v)} ${cls}" title="Fachpresse-Wertung">${Math.round(v)}</span>` : "";
function revLabel(p, n){
  if (n < 10) return "Zu wenige Rezensionen";
  if (p >= 95 && n >= 500) return "Äußerst positiv";
  if (p >= 80) return n >= 50 ? "Sehr positiv" : "Positiv";
  if (p >= 70) return "Größtenteils positiv";
  if (p >= 40) return "Ausgeglichen";
  if (p >= 20) return "Größtenteils negativ";
  return n >= 500 ? "Äußerst negativ" : n >= 50 ? "Sehr negativ" : "Negativ";
}
const platLabel = r => r.device === "PC" ? r.store : r.device;
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function toast(msg){ const t=document.createElement("div"); t.textContent=msg;
  t.style.cssText="position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#f6f4ff;color:#101216;padding:12px 18px;border-radius:999px;font-weight:800;z-index:99;box-shadow:0 10px 30px #0008";
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ================= Verschlüsselung (Handy-App) ================= */
const enc = new TextEncoder();
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
function b64e(u8){ let s=""; for (let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
async function deriveKeys(pass, salt, it){
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:it}, base, 512));
  const ek = await crypto.subtle.importKey("raw", bits.slice(0,32), {name:"HMAC",hash:"SHA-256"}, false, ["sign"]);
  const mk = await crypto.subtle.importKey("raw", bits.slice(32), {name:"HMAC",hash:"SHA-256"}, false, ["sign","verify"]);
  return {ek, mk};
}
async function keystream(ek, nonce, len){
  const n = Math.ceil(len/32), out = new Uint8Array(n*32);
  for (let i=0;i<n;i+=1024){
    const ps = [];
    for (let j=i;j<Math.min(n,i+1024);j++){ const m=new Uint8Array(nonce.length+4); m.set(nonce); new DataView(m.buffer).setUint32(nonce.length,j); ps.push(crypto.subtle.sign("HMAC",ek,m)); }
    (await Promise.all(ps)).forEach((r,k)=>out.set(new Uint8Array(r),(i+k)*32));
  }
  return out.subarray(0,len);
}
const concat = (...a) => { const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0)); let p=0; a.forEach(x=>{o.set(x,p);p+=x.length}); return o; };
async function decryptBlob(text, pass){
  const d = JSON.parse(text), salt=b64d(d.salt), nonce=b64d(d.nonce), ct=b64d(d.ct), tag=b64d(d.tag);
  const {ek, mk} = await deriveKeys(pass, salt, d.it||310000);
  if (!await crypto.subtle.verify("HMAC", mk, tag, concat(salt,nonce,ct))) throw new Error("Falsches Passwort");
  const ks = await keystream(ek, nonce, ct.length), pt = new Uint8Array(ct.length);
  for (let i=0;i<ct.length;i++) pt[i] = ct[i]^ks[i];
  let bytes = pt;
  if (d.gz) bytes = new Uint8Array(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function encryptObj(obj, pass){
  const it = 310000, salt = crypto.getRandomValues(new Uint8Array(16)), nonce = crypto.getRandomValues(new Uint8Array(12));
  const pt = enc.encode(JSON.stringify(obj)), {ek, mk} = await deriveKeys(pass, salt, it);
  const ks = await keystream(ek, nonce, pt.length), ct = new Uint8Array(pt.length);
  for (let i=0;i<pt.length;i++) ct[i] = pt[i]^ks[i];
  const tag = new Uint8Array(await crypto.subtle.sign("HMAC", mk, concat(salt,nonce,ct)));
  return JSON.stringify({v:1,it,gz:false,salt:b64e(salt),nonce:b64e(nonce),ct:b64e(ct),tag:b64e(tag)});
}

/* ================= Speicher (Handy) ================= */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k) ?? sessionStorage.getItem(k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v, persist=true){ try { (persist?localStorage:sessionStorage).setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch(e){} },
};
const pass = () => store.get("gr_pass", null);
const edits = () => store.get("gr_edits", []);

/* ================= Daten laden ================= */
async function load(quiet){
  if (CLOUD) return loadCloud();
  let d;
  try { d = await (await fetch(`/api/data?period=${S.period}`)).json(); }
  catch(e){ if (!quiet) setView(`<div class="empty"><div class="big">📡</div><h2>Keine Verbindung</h2><p class="help">Läuft Gaming Recap noch auf deinem PC?</p></div>`); return; }
  // Während des Abgleichs nicht ständig neu zeichnen: erst wenn er fertig ist (oder beim ersten Laden)
  if (quiet && d.syncing){ setTimeout(()=>load(true), 3000); return; }
  if (quiet && $("dialog[open]")) { setTimeout(()=>load(true), 3000); return; }
  S.data = d; S.yearPM = undefined; S.pcache = {};
  applyEstimate(); buildGroups(); header(); quiet ? quietRoute() : route(); setTimeout(saveYearArchive, 1500);
  if (!quiet && d.can_edit && !d.configured && !store.get("gr_wizard", 0) && !WZ.shown){ WZ.shown = true; setTimeout(()=>openWizard(0), 600); }
  if (S.data.syncing) setTimeout(()=>load(true), 3000);
}

async function loadCloud(force){
  if (!pass()) return lockScreen();
  if (!S.snap || force){
    let text = null;
    try { const r = await fetch(`data.enc?t=${Date.now()}`, {cache:"no-store"}); if (r.ok) text = await r.text(); } catch(e){}
    if (text) store.set("gr_blob", text); else text = store.get("gr_blob", null);
    if (!text){ setView(`<div class="empty"><div class="big">☁️</div><h2>Noch keine Daten</h2><p class="help">Dein PC hat noch nichts hochgeladen. Prüfe in den Einstellungen am PC den Bereich „Handy-App“.</p></div>`); return; }
    try { S.snap = await decryptBlob(text, pass()); }
    catch(e){ store.del("gr_pass"); return lockScreen("Das Passwort passt nicht."); }
    // Bereits vom PC übernommene Änderungen aus der Warteschlange entfernen
    const meta = S.snap.meta || {};
    store.set("gr_edits", edits().filter(e => {
      if (e.kind === "kv"){
        if (e.key === "wrapped") return false;
        const u = e.key === "goals" ? S.snap.goals_updated : (S.snap.kv_updated||{})[e.key];
        return !(u && Date.parse(u) >= e.ts) && Date.now() - e.ts < 7*864e5; }
      const m = meta[norm(e.key)]; return !(m && m.updated && Date.parse(m.updated) >= e.ts) && Date.now()-e.ts < 30*86400e3; }));
  }
  const snap = S.snap, meta = {...(snap.meta||{})};
  let goals = snap.goals || {}; const kvs = {year_overrides: snap.year_overrides || {}, wrapped: snap.wrapped_archive || {}, notpc: snap.notpc || {}, snotes: snap.snotes || {}, covers: snap.covers || {}, paid: snap.paid || {}, notify: snap.notify || null, critic: snap.critic || {}};
  for (const e of edits()){
    if (e.kind === "kv"){ if (e.key === "goals") goals = e.value; else kvs[e.key] = e.value; continue; }
    const k = norm(e.key); meta[k] = {...(meta[k]||{}), ...pick(e,["status","rating","note","tier","hide"]), updated:new Date(e.ts).toISOString()};
  }
  const p = S.period === "all" ? null : (snap.periods||{})[S.period];
  S.data = {last_sync:snap.last_sync, sources:snap.sources||{}, games:snap.games||[], meta, hltb:snap.hltb||{},
    sessions:snap.sessions||[], csessions:snap.csessions||[], status_log:snap.status_log||[], goals, steam:snap.steam||{}, prefs:snap.prefs||{},
    year_overrides: kvs.year_overrides, wrapped_archive: kvs.wrapped, notpc: kvs.notpc, snotes: kvs.snotes, covers: kvs.covers, paid: kvs.paid, notify: kvs.notify, critic: kvs.critic, push_ready: !!snap.push_ready, wl_deals: snap.wl_deals || {}, metacritic: snap.metacritic || {},
    values: snap.values || {}, values_at: snap.values_at, xcovers: snap.xcovers || {}, partner: snap.partner || null, me_name: snap.me_name || "",
    tracking_since: snap.tracking_since, health: snap.health || [],
    trophies: snap.trophies || [], free_games: snap.free_games || [],
    playing:[], can_edit:false, period: p ? p.info : {period:"all"}, period_minutes: p ? p.pm : null};
  S.pcache = {}; S.yearPM = undefined; S.yearInfo = undefined;

/* ================= Schätzung für Zeiträume =================
   Die Plattformen liefern nur Gesamtzeiten. Bis der Verlauf einen Zeitraum vollständig
   abdeckt, schätzen wir den Anteil je Spiel:
   - Steam-Spiele mit Erfolgen: Anteil der Erfolge, die im Jahr freigeschaltet wurden
   - sonst: jüngere Spielzeit zählt stärker (Halbwertszeit 1 Jahr) zwischen erstem und letztem Spieltag
   - Steam "letzte 2 Wochen" für Woche und Monat
   - eigene Korrekturen (pro Spiel) haben immer Vorrang
   Gemessene Zuwächse seit Start der Aufzeichnung kommen jeweils oben drauf. */
const HALF = 365*864e5, LN2 = Math.log(2);
function periodStartDate(p){ const n = new Date(); if (p==="year") return new Date(n.getFullYear(),0,1); if (p==="month") return new Date(n.getFullYear(),n.getMonth(),1); if (p==="week") return new Date(Date.now()-7*864e5); return null; }
function estimatePeriod(p, measured){
  const ps = periodStartDate(p), now = new Date(), year = now.getFullYear(), out = {};
  const ach = (S.data.steam||{}).ach || {};
  for (const r of S.data.games){
    const delta = measured ? (measured[r.id]||0) : 0, base = Math.max(0, (r.minutes||0) - delta), last = pdate(r.last_played);
    let est = 0;
    if (base && last && last >= ps){
      const end = last > now ? now : last;
      let first = pdate(r.first_played);
      const ry = Number(r.release_year);
      if (!first && ry >= 1970 && ry <= year) first = new Date(ry,0,1);
      let share = null;
      const a = r.steam_appid && ach[r.steam_appid];
      if (p === "year" && a && a.d >= 3 && (a.y||{})[year]) share = (a.y[year]||0) / a.d;
      let tw = false;
      if (share === null && (p === "week" || p === "month") && r.two_weeks){ share = Math.min(r.minutes||0, r.two_weeks * Math.min(1, (now-ps)/(14*864e5))) / base; tw = true; }
      if (share === null){
        if (first && first >= ps) share = 1;
        else {
          const lam = LN2 / HALF, win = 1 - Math.exp(-lam * (end - ps));
          const norm = first ? 1 - Math.exp(-lam * Math.max(end - first, end - ps)) : 1;
          share = norm > 0 ? win / norm : 1;
        }
      }
      est = Math.round(base * Math.max(0, Math.min(tw ? 99 : 1, share)));
      // Steam "letzte 2 Wochen" enthält die gemessene Zeit schon
      if (tw){ if (Math.max(est, delta) > 0) out[r.id] = Math.max(est, delta); continue; }
    }
    if (est + delta > 0) out[r.id] = est + delta;
  }
  // Aufgezeichnete PC-Sessions sind exakt: mindestens so viel zählen
  const sess = {};
  for (const [k, st, sec] of (S.data.sessions||[])) if (st*1000 >= +ps) sess[k] = (sess[k]||0) + sec/60;
  if (Object.keys(sess).length){
    const pcBy = {};
    for (const r of S.data.games) if (r.device === "PC"){ const k = norm(r.title); (pcBy[k] = pcBy[k] || []).push(r); }
    for (const [k, mins] of Object.entries(sess)){
      const recs = pcBy[k]; if (!recs) continue;
      const cur = recs.reduce((s,r)=>s+(out[r.id]||0),0);
      if (mins > cur){ const top = [...recs].sort((a,b)=>(b.minutes||0)-(a.minutes||0))[0]; out[top.id] = (out[top.id]||0) + Math.round(mins - cur); }
    }
  }
  // Eigene Korrekturen (pro Spiel) – nur fürs Jahr
  const ov = p === "year" ? ((S.data.year_overrides||{})[String(year)] || {}) : {};
  if (Object.keys(ov).length){
    const byKey = {};
    for (const r of S.data.games){ const k = norm(r.title); (byKey[k] = byKey[k] || []).push(r); }
    for (const [k, mins] of Object.entries(ov)){
      const recs = byKey[k]; if (!recs) continue;
      const sum = recs.reduce((s,r)=>s+(out[r.id]||0),0);
      if (sum > 0) for (const r of recs) out[r.id] = Math.round(mins * (out[r.id]||0) / sum);
      else { const top = [...recs].sort((a,b)=>(b.minutes||0)-(a.minutes||0))[0]; for (const r of recs) delete out[r.id]; out[top.id] = mins; }
    }
  }
  return out;
}
function applyEstimate(){
  const p = S.data.period || {};
  if (p.period && p.period !== "all" && !p.complete){ S.data.period_minutes = estimatePeriod(p.period, S.data.period_minutes); p.estimated = true; }
}

function autoStatus(g){
  const c = (g.completion||"").toLowerCase();
  if (c){
    if (/not|nicht|ungespielt/.test(c)) return "ungespielt";
    if (/plan|geplant|wunsch/.test(c)) return "als_naechstes";
    if (/hold|pausiert|pause/.test(c)) return "pausiert";
    if (/abandon|abgebrochen/.test(c)) return "abgebrochen";
    if (/complet|abgeschlossen|100|komplett/.test(c)) return "komplett";
    if (/beaten|beendet|durch|geschafft/.test(c)) return "durchgespielt";
  }
  const ft = g.features.map(x=>x.toLowerCase());
  const mp = ft.some(x=>/multi|online|pvp|mmo/.test(x)), sp = ft.some(x=>/single|einzel/.test(x));
  if ((mp && !sp) || g.genres.some(x=>/battle royale|mmo/i.test(x))) return "endlos";
  if (c && /play|spiel/.test(c)) return "angefangen";
  return g.pcMinutes > 0 ? "angefangen" : "ungespielt";
}
function coverOrder(urls, extra){
  // Playnite-Cover (nur am PC erreichbar) > Steam > IGDB > Plattform-Bild
  const pn=[], st=[], nat=[];
  for (const u of urls){ if (u.startsWith("/api/img")) { if (LOCAL) pn.push(u); } else if (u.includes("steamstatic")) st.push(u); else nat.push(u); }
  return [...new Set([...pn, ...st, ...(extra||[]), ...nat])];
}
const DEFAULT_BL_STORES = ["Steam","Ubisoft","EA","GOG","Epic Games"];
const backlogStores = () => ((S.data && S.data.prefs && S.data.prefs.backlog_stores) || DEFAULT_BL_STORES);
function buildGroups(){
  const d = S.data, pm = d.period_minutes, m = new Map();
  for (const r of d.games){
    const k = norm(r.title) || r.id;
    let g = m.get(k);
    if (!g){ g = {key:k, title:r.title, recs:[], minutes:0, pmin:0, pcMinutes:0, plats:{}, devs:{}, pc:false, genres:new Set(), features:new Set(),
      devsList:new Set(), year:null, added:null, last:null, installed:false, hidden:true, completion:null, first:null}; m.set(k,g); }
    g.recs.push(r);
    const mins = r.minutes||0, pmins = pm ? (pm[r.id]||0) : mins;
    g.minutes += mins; g.pmin += pmins;
    const pl = platLabel(r);
    g.plats[pl] = (g.plats[pl]||0) + pmins;
    g.devs[r.device] = (g.devs[r.device]||0) + pmins;
    if (r.device === "PC"){
      g.pc = true; g.pcMinutes += mins;
      g.pcStores = g.pcStores || new Set(); g.pcStores.add(r.store);
      if (!r.family && backlogStores().includes(r.store)) g.owned = true;
      if (!r.hidden) g.hidden = false;
      (r.genres||[]).forEach(x=>g.genres.add(x)); (r.features||[]).forEach(x=>g.features.add(x));
      (r.developers||[]).forEach(x=>g.devsList.add(x));
      const ry = Number(r.release_year);
      if (ry >= 1970 && ry <= new Date().getFullYear()+1 && (!g.year || ry < g.year)) g.year = ry;
      const a = pdate(r.added); if (a && (!g.added || a < g.added)) g.added = a;
      if (r.installed) g.installed = true;
      if (r.completion && !g.completion) g.completion = r.completion;
    }
    if (r.device !== "PC") g.consoleMin = (g.consoleMin||0) + mins;
    const l = pdate(r.last_played); if (l && (!g.last || l > g.last)) g.last = l;
    const f = pdate(r.first_played); if (f && (!g.first || f < g.first)) g.first = f;
  }
  for (const g of m.values()){
    const recs = [...g.recs].sort((a,b)=>(b.minutes||0)-(a.minutes||0));
    const pcRec = recs.find(r=>r.device==="PC"); g.title = cleanTitle(pcRec ? pcRec.title : recs[0].title) || recs[0].title;
    g.hltb = (d.hltb||{})[g.key] || null;
    // IGDB hat bei manchen Spielen unsinnige Werte (Community-Angaben): über 300 Std ignorieren, außer selbst eingetragen
    if (g.hltb && !g.hltb.manual){ const cap = v => v && v > 300*60 ? null : v; g.hltb = {...g.hltb, main: cap(g.hltb.main), plus: cap(g.hltb.plus), comp: g.hltb.comp && g.hltb.comp > 600*60 ? null : g.hltb.comp}; }
    const hImg = g.hltb && g.hltb.image ? [g.hltb.image] : [];
    const man = ((d.covers||{})[g.key]), xc = (d.xcovers||{})[g.key];
    g.covers = coverOrder(recs.flatMap(r=>r.covers||[]), hImg);
    if (xc) g.covers.push(xc);
    if (man) g.covers = [man, ...g.covers.filter(u=>u!==man)];
    g.banners = coverOrder(recs.flatMap(r=>r.banners||[]), hImg).concat(g.covers.filter(c=>!c.includes("library_600x900")));
    g.genres = [...g.genres]; g.features = [...g.features]; g.devsList = [...g.devsList];
    g.meta = d.meta[g.key] || {};
    g.tier = g.minutes >= 300 ? (g.meta.tier || null) : null; // Tier-Liste erst ab 5 Std
    const sr = recs.find(r=>r.steam_appid); g.appid = sr ? sr.steam_appid : null;
    const sx = d.steam || {};
    g.ach = g.appid && sx.ach ? sx.ach[g.appid] || null : null;
    g.price = g.appid && sx.prices ? sx.prices[g.appid] || null : null;
    const scr = g.appid && sx.scores ? sx.scores[g.appid] || null : null;
    const pnCritic = Math.max(0, ...recs.map(r=>Number(r.critic)||0));
    // Wertung: Metacritic (RAWG) > Metacritic (Steam) > Fachpresse-Schnitt von IGDB (auch über Playnite)
    const rm = (d.metacritic||{})[g.key], own = (d.critic||{})[g.key];
    g.critic = own || (rm ? rm[0] : scr && scr.mc ? scr.mc : pnCritic || (g.hltb && g.hltb.critic) || null);
    g.criticSrc = own ? "Selbst" : rm || (scr && scr.mc) ? "Metacritic" : g.critic ? "IGDB" : null;
    g.mcSlug = rm ? rm[1] : null;
    g.rev = scr && scr.rt ? {pct: scr.rp, total: scr.rt} : null;
    g.auto = autoStatus(g);
    g.status = g.meta.status || g.auto;
    g.isAuto = !g.meta.status;
    g.remaining = remaining(g);
  }
  S.allGroups = [...m.values()];
  for (const g of S.allGroups) g.hide = !!g.meta.hide;
  S.groups = S.allGroups.filter(g=>!g.hide);
  for (const g of S.allGroups) for (const r of g.recs){ const k = norm(r.title); if (k && !m.has(k)) m.set(k, g); }
  S.gmap = m;
}
function remaining(g){
  if (!g.hltb || !g.hltb.main || !g.pc || SMAP[g.status].g !== "open" || g.status === "endlos") return null;
  if (g.genres.some(x=>/battle royale|mmo|massively/i.test(x))) return null;
  const main = g.hltb.main;
  return g.status==="angefangen" || g.status==="pausiert" ? Math.max(main - g.pcMinutes, main*0.15) : main;

/* Sanftes Neuzeichnen: Innerhalb derselben Seite (Zeitraum, Reiter) wird nur geändert, was sich wirklich ändert.
   Zahlen zählen vom alten zum neuen Wert, Balken wachsen/schrumpfen, neue Teile blenden weich ein. */
const MORPH = {counts:[], bars:[]};
function setView(h){
  const v = $("#view");
  if (S.rendered !== cur() || !v.firstElementChild || matchMedia("(prefers-reduced-motion: reduce)").matches){ v.innerHTML = h; return; }
  const b = document.createElement("main"); b.innerHTML = h;
  MORPH.counts = []; MORPH.bars = [];
  morphKids(v, b);
  const {counts, bars} = MORPH;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    bars.forEach(el=>{ if (el.dataset.w) el.style.width = el.dataset.w; if (el.dataset.h) el.style.height = el.dataset.h; });
    counts.forEach(([el, from])=>{ const to = Number(el.dataset.count), dec = Number(el.dataset.dec||0), pre = el.dataset.pre||"", t0 = performance.now();
      if (!isFinite(from)) from = 0;
      const step = t => { const p = Math.min(1,(t-t0)/900), e = 1-Math.pow(1-p,3); el.textContent = pre + num(from + (to-from)*e, dec); if (p<1) requestAnimationFrame(step); };
      requestAnimationFrame(step); });

}
const MSKIP = new Set(["in","on","mfade","hov","tilt","live"]);
const sigOf = n => n.nodeName + "#" + (n.id||"") + "." + [...n.classList].filter(c=>!MSKIP.has(c)).sort().join(".");
function morphKids(a, b){
  const ac = [...a.childNodes], bc = [...b.childNodes];
  if (ac.length === bc.length && ac.every((n,i)=>n.nodeType===bc[i].nodeType && (n.nodeType!==1 || sigOf(n)===sigOf(bc[i])))){ ac.forEach((n,i)=>morphNode(n, bc[i])); return; }
  const used = new Set(), out = [];
  for (const n of bc){
    if (n.nodeType !== 1){ out.push(n); continue; }
    const sg = sigOf(n), m = ac.find(o=>o.nodeType===1 && !used.has(o) && sigOf(o)===sg);
    if (m){ used.add(m); morphNode(m, n); out.push(m); } else { n.classList.add("mfade"); out.push(n); }
  }
  for (const o of ac) if (!used.has(o)) o.remove();
  let ref = a.firstChild;
  for (const n of out){ if (n === ref) ref = ref.nextSibling; else a.insertBefore(n, ref); }
}
function morphNode(a, b){
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName){ if (b.nodeType===1) b.classList.add("mfade"); a.replaceWith(b); return; }
  if (a.nodeType !== 1){ if (a.data !== b.data) a.data = b.data; return; }
  if (a.nodeName === "IMG" && a.getAttribute("src") === b.getAttribute("src")) return;
  const hadIn = a.classList.contains("in"), hadTilt = a.classList.contains("tilt"), oW = a.style.width, oH = a.style.height;
  const isCount = b.hasAttribute("data-count"), oldVal = isCount ? Number(String(a.textContent).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",",".")) : 0;
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for (const at of b.attributes) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  if (hadIn) a.classList.add("in"); if (hadTilt) a.classList.add("tilt");
  if (b.dataset.w !== undefined){ a.style.width = oW || "0"; MORPH.bars.push(a); }
  if (b.dataset.h !== undefined){ a.style.height = oH || "0"; MORPH.bars.push(a); }
  if (isCount){ if (a.classList.contains("in") || a.closest(".in")) MORPH.counts.push([a, oldVal]); else a.textContent = b.textContent; return; }
  morphKids(a, b);
}

// Format: [key, start, sekunden, gerät, ungefähr]
function allSessions(){
  const pc = (S.data.sessions||[]).map(x=>[x[0], x[1], x[2], "PC", 0]);
  const co = (S.data.csessions||[]).map(x=>[x[0], x[1], x[2], x[3], x[4]]);
  return pc.concat(co).sort((a,b)=>a[1]-b[1]);
}
function sessionStats(fromTs){
  const ss = allSessions().filter(s=>!fromTs || s[1] >= fromTs);
  const perDay = {}, perDayC = {}, approxDay = {}, hours = new Array(24).fill(0), wd = new Array(7).fill(0), perGame = {};
  let longest = null, total = 0;
  for (const [k, s, sec, dev, ap] of ss){
    const d = new Date(s*1000), min = sec/60, dk = dayKey(d);
    total += min;
    perDay[dk] = (perDay[dk]||0) + min;
    if (dev !== "PC") perDayC[dk] = (perDayC[dk]||0) + min;
    if (ap) approxDay[dk] = true;
    wd[(d.getDay()+6)%7] += min;
    perGame[k] = (perGame[k]||0) + min;
    if (ap) continue; // Uhrzeit unbekannt: nicht in Uhrzeit-Statistik und Rekorde
    let t = s; const end = s + sec;
    while (t < end){ const x = new Date(t*1000), h = x.getHours(); x.setMinutes(60,0,0); const nt = Math.min(end, x.getTime()/1000); hours[h] += (nt-t)/60; t = nt; }
    if (!longest || sec > longest[2]) longest = [k, s, sec];
  }
  const days = Object.keys(perDay).sort();
  let best = 0, run = 0, prev = null;
  for (const dk of days){ const d = new Date(dk+"T12:00"); run = prev && (d-prev)/864e5 < 1.5 ? run+1 : 1; best = Math.max(best, run); prev = d; }
  const set = new Set(days); let curStreak = 0; const t = new Date(); t.setHours(12,0,0,0);
  if (!set.has(dayKey(t))) t.setDate(t.getDate()-1);
  while (set.has(dayKey(t))){ curStreak++; t.setDate(t.getDate()-1); }
  const win = {Nachteule:[22,23,0,1,2,3,4], Frühaufsteher:[5,6,7,8,9,10], Mittagszocker:[11,12,13,14,15,16], "Feierabend-Gamer":[17,18,19,20,21]};
  const wsum = Object.fromEntries(Object.entries(win).map(([k,hs])=>[k, hs.reduce((s,h)=>s+hours[h],0)]));
  const type = hours.some(v=>v>0) ? Object.entries(wsum).sort((a,b)=>b[1]-a[1])[0][0] : null;
  const since = ss.length ? ss[0][1] : null;
  const htot = hours.reduce((a,b)=>a+b,0);
  return {ss, perDay, perDayC, approxDay, hours, wd, perGame, longest, total, days, best, curStreak, type, night: htot ? wsum.Nachteule/htot : 0,
    weekend: total ? (wd[5]+wd[6])/total : 0, since, avg: ss.length ? total/ss.length : 0};
}
function titleOf(k){ const g = S.gmap.get(k); return g ? g.title : k; }
function weeklyPace(){
  const ss = allSessions(); if (!ss.length) return null;
  const now = Date.now()/1000, first = ss[0][1];
  if (now - first < 7*86400) return null;
  const from = Math.max(first, now - 56*86400);
  const min = ss.filter(s=>s[1]>=from).reduce((a,s)=>a+s[2]/60,0);
  return min / ((now-from)/(7*86400));
}

/* Bibliothekswert: IsThereAnyDeal (Normalpreis, heute, Tiefstpreis), sonst Steam-Store */
function libValue(){
  const V = (S.data||{}).values || {}, out = [];
  for (const g of S.groups){
    if (!g.pc || !g.owned) continue;
    const v = V[g.key]; let r = null, c = null, l = null, src = null;
    if (v && (v[0] || v[2])){ [r, c, l] = v; src = "itad"; if (!r) r = Math.max(c||0, l||0); }
    else if (g.price && !g.price.free && g.price.orig){ r = g.price.orig; c = g.price.price != null ? g.price.price : g.price.orig; src = "steam"; }
    if (!r) continue;
    if (c == null) c = r;
    l = l == null ? c : Math.min(l, c);
    const pcRecs = g.recs.filter(x=>x.device==="PC").sort((a,b)=>(b.minutes||0)-(a.minutes||0));
    out.push({g, r, c, l, src, store: (pcRecs[0]||{}).store || "PC"});
  }
  const sum = (k, list) => (list||out).reduce((s,x)=>s+x[k],0);
  const shame = out.filter(x=>!x.g.minutes);
  const stores = {}; for (const x of out) stores[x.store] = (stores[x.store]||0) + x.r;
  // Konsolenspiele (geschätzt über den PC-Preis desselben Spiels)
  const con = [];
  for (const g of S.groups){
    if (g.owned || !g.consoleMin && g.pc) continue;
    if (!Object.keys(g.devs).some(d=>d!=="PC")) continue;
    const v = V[g.key]; if (!v || !(v[0] || v[2])) continue;
    let [r, c, l] = v; if (!r) r = Math.max(c||0, l||0); if (c == null) c = r; l = l == null ? c : Math.min(l, c);
    con.push({g, r, c, l, src:"itad", store: Object.keys(g.devs).find(d=>d!=="PC") || "Konsole"});
  }
  // Was du selbst eingetragen hast
  const P = (S.data||{}).paid || {}, paid = [];
  for (const g of S.groups){ const v = P[g.key]; if (v == null) continue; const x = out.find(y=>y.g===g) || con.find(y=>y.g===g);
    paid.push({g, p: v, r: x ? x.r : null}); }
  const paidSum = paid.reduce((s,x)=>s+Math.max(0,x.p),0), paidR = paid.reduce((s,x)=>s+(x.r||0),0);
  return {list:out, r:sum("r"), c:sum("c"), l:sum("l"), itad: out.some(x=>x.src==="itad"), shame, shameR: sum("r", shame), shameL: sum("l", shame),
    stores: Object.entries(stores).sort((a,b)=>b[1]-a[1]), at: (S.data||{}).values_at,
    con, conR: sum("r", con), conC: sum("c", con), conL: sum("l", con), paid, paidSum, paidR};
}

/* Rhythmus: Wochentag × Uhrzeit */
function rhythmCard(){
  const from = periodStart(), M = Array.from({length:7},()=>new Array(24).fill(0)); let n = 0;
  for (const [k,s,sec,dev,ap] of allSessions()){
    if (ap || (from && s < from)) continue; n++;
    let t = s; const end = s + sec;
    while (t < end){ const x = new Date(t*1000), h = x.getHours(), wd = (x.getDay()+6)%7; x.setMinutes(60,0,0); const nt = Math.min(end, x.getTime()/1000); M[wd][h] += (nt-t)/60; t = nt; }
  }
  if (n < 5) return "";
  let mx = 0, bw = 0, bh = 0; M.forEach((r,w)=>r.forEach((v,h)=>{ if (v > mx){ mx = v; bw = w; bh = h; } }));
  const st = sessionStats(from), WDN = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
  const wdT = M.map(r=>r.reduce((a,b)=>a+b,0)), bd = wdT.indexOf(Math.max(...wdT));
  return `<section class="card s6 x4 reveal"><h3>🕒 Wann du spielst <span class="h3s">${esc(scopeLabel())}</span> ${qi("rhythm")}</h3>
    <div class="eyebrow" style="opacity:.8">Lieblingszeit</div><div class="mid" style="margin:4px 0 2px">${WD[bw]}, ${bh} Uhr</div>
    <div class="rhy">${M.map((r,w)=>`<span>${WD[w]}</span>${r.map((v,h)=>`<i style="--d:${(w*24+h)*4}ms;${v?`background:color-mix(in srgb,var(--cyan) ${Math.round(18+v/mx*82)}%,#181B21)`:""}" title="${WDN[w]} ${h} Uhr: ${hrs(v)}"></i>`).join("")}`).join("")}</div>
    <div class="rhyh"><span></span>${Array.from({length:24},(_,h)=>`<span>${h%6===0?h:""}</span>`).join("")}</div>
    <div class="rhs"><div><small>Lieblingstag</small><b>${WDN[bd]}</b></div><div><small>Längste Session</small><b>${st.longest?hrs(st.longest[2]/60):"–"}</b></div><div><small>Ø Session</small><b>${hrs(st.avg)}</b></div></div>
    <p class="help" style="margin-bottom:0">Aus ${n} Sessions mit bekannter Uhrzeit.</p></section>`;
}

        <b>${esc(x.v)}</b><span>${esc(x.s)}</span><em>${esc(x.scope)}</em></button>`).join("")}</div></section></div>`;
  setView(h);
}

function tempoStats(){
  const done = S.groups.filter(g=>g.pc && SMAP[g.status].g==="done" && g.hltb && g.hltb.main && g.pcMinutes > 30);
  if (done.length < 3) return null;
  const r = done.map(g => g.pcMinutes / (g.status==="komplett" && g.hltb.comp ? g.hltb.comp : g.hltb.main)).sort((a,b)=>a-b);
  return {pct: (r[Math.floor(r.length/2)] - 1) * 100, n: done.length};
}

// Dieser Monat/dieses Jahr gegen den vorigen Zeitraum (aus dem Wrapped-Archiv)
function compareCard(){
  const A = S.data.wrapped_archive || {}, n = new Date(), pad = x => String(x).padStart(2,"0");
  const cm = `${n.getFullYear()}-${pad(n.getMonth()+1)}`, pmD = new Date(n.getFullYear(), n.getMonth()-1, 1), pm = `${pmD.getFullYear()}-${pad(pmD.getMonth()+1)}`;
  const cy = String(n.getFullYear()), py = String(n.getFullYear()-1);
  const tot = a => a ? Object.values(a.games||{}).reduce((s,x)=>s+x[0],0) : 0;
  const pairs = [];
  if (A[pm] && A[cm]) pairs.push([n.toLocaleDateString("de-DE",{month:"long"}), pmD.toLocaleDateString("de-DE",{month:"long"}), A[cm], A[pm], n.getDate()/new Date(n.getFullYear(), n.getMonth()+1, 0).getDate()]);
  if (A[py] && A[cy]) pairs.push([cy, py, A[cy], A[py], (n - new Date(n.getFullYear(),0,1))/(365*864e5)]);
  if (!pairs.length) return "";
  const top = a => Object.entries(a.games||{}).sort((x,y)=>y[1][0]-x[1][0])[0];
  return `<section class="card reveal"><h3>📊 Vergleich</h3><div class="cmpw">${pairs.map(([l1,l2,a,b,frac])=>{ const t1 = tot(a), t2 = tot(b), pace = frac > 0 ? t1/frac : t1, d = t2 ? (pace/t2-1)*100 : 0;
    const g1 = top(a), g2 = top(b);
    return `<div class="cmpp"><div><small>${esc(l1)} bisher</small><b>${hrs(t1)}</b><span>${g1 && S.gmap.get(g1[0]) ? "meist " + esc(S.gmap.get(g1[0]).title) : ""}</span></div>
      <div class="vs" style="color:${d>=0?"var(--lime)":"#FFB547"}">${d>=0?"▲":"▼"} ${num(Math.abs(d))} %<small>auf Kurs</small></div>
      <div><small>${esc(l2)}</small><b>${hrs(t2)}</b><span>${g2 && S.gmap.get(g2[0]) ? "meist " + esc(S.gmap.get(g2[0]).title) : ""}</span></div></div>`; }).join("")}</div>
    <p class="help">„Auf Kurs“: hochgerechnet aufs ganze ${pairs.length>1?"Jahr bzw. den ganzen Monat":"Zeitraum"}.</p></section>`;
}

window.sysAction = async what => {
  if (what === "quit" && !confirm("Gaming Recap beenden? Bis zum nächsten Start werden keine Sessions erfasst.")) return;
  try { await post("/api/" + what, {}); } catch(e){ toast("Ging nicht: " + e.message); return; }
  $("#settings").close();
  if (what === "quit"){ setView(`<div class="empty"><div class="big">⏻</div><h2>Gaming Recap ist beendet</h2><p class="help">Starte es wieder über <b>Start</b> im Ordner GamingRecap.</p></div>`); return; }
  toast("Starte neu …");
  const t0 = Date.now();
  await new Promise(r=>setTimeout(r, 2500));
  while (Date.now() - t0 < 60000){
    try { const r = await fetch("/api/config", {cache:"no-store"}); if (r.ok){ location.reload(); return; } } catch(e){}

  }

};

const hl = g => g.hltb && g.hltb.main ? g.hltb.main : Infinity;
function libGrid(){
  const L = S.lib, q = norm(L.q);
  const base = L.dev === "hidden" ? S.allGroups.filter(g=>g.hide) : S.groups;
  const list = base.filter(g => (!L.dev || L.dev==="hidden" || g.devs[L.dev]!==undefined) && (!q || g.key.includes(q)) && (!L.played || g.minutes>0));
  list.sort({min:(a,b)=>b.minutes-a.minutes, last:(a,b)=>(b.last||0)-(a.last||0), name:(a,b)=>a.title.localeCompare(b.title,"de"),
    year:(a,b)=>(b.year||0)-(a.year||0), added:(a,b)=>(b.added||0)-(a.added||0), hltb:(a,b)=>hl(a)-hl(b),
    critic:(a,b)=>(b.critic||0)-(a.critic||0), rev:(a,b)=>((b.rev&&b.rev.total>=50)?b.rev.pct:0)-((a.rev&&a.rev.total>=50)?a.rev.pct:0)}[L.sort]);
  $("#grid").innerHTML = list.slice(0,L.limit).map(g=>`<div class="gcard" onclick="openGame('${esc(g.key)}')">
    <div class="poster">${img(g.covers,g.title)}${mcBadge(g.critic,"mcb")}<div class="dev">${Object.keys(g.devs).map(d=>`<i style="background:${DEV_COLORS[d]}"></i>`).join("")}</div>
    <div class="ov">${g.minutes?`<b>${hrs(g.minutes)}</b>`:""}</div></div><div class="nm">${esc(g.title)}</div></div>`).join("") || `<p class="help">Nichts gefunden.</p>`;
  $("#moreWrap").innerHTML = list.length > L.limit ? `<button class="btn ghost more" onclick="S.lib.limit+=120;libGrid()">Mehr anzeigen (${list.length-L.limit})</button>` : "";
}

/* ================= Backlog ================= */
const notPc = g => !!((S.data||{}).notpc||{})[g.key];
const consoleOnly = g => notPc(g) || (!g.pcMinutes && (g.consoleMin||0) > 0);
const blGames = () => S.groups.filter(g=>g.pc && !g.hidden && g.owned && !consoleOnly(g));
function platChips(g){
  const seen = new Map();
  for (const r of g.recs){ const l = platLabel(r); if (!seen.has(l)) seen.set(l, 0); seen.set(l, seen.get(l) + (r.minutes||0)); }
  return [...seen.entries()].sort((a,b)=>b[1]-a[1]).map(([l,m])=>`<span class="pc-chip" title="${esc(l)}${m?" · "+hrs(m):""}"><i style="background:${pcolor(l)}"></i>${esc(l)}</span>`).join("");
}
function backlogStats(){
  const b = blGames(); let open=0, done=0, unplayed=0, rest=0, known=0;
  for (const g of b){ const gr = SMAP[g.status].g; if (gr==="open"){ open++; if (g.remaining!=null){ rest+=g.remaining; known++; } } if (gr==="done") done++; if (g.status==="ungespielt") unplayed++; }
  return {total:b.length, open, done, unplayed, rest, known, pct: open+done ? done/(open+done)*100 : 0};
}
function pill(g){
  const s = SMAP[g.status];
  return `<span class="pill ${g.isAuto?"auto":""}" style="background:${s.c}22;color:${s.c}">${s.e} ${s.l}</span>`;
}
function forecast(st){
  const pace = weeklyPace();
  if (!st.rest) return "";
  if (!pace) return `Prognose folgt, sobald der Tracker eine Woche gesammelt hat.`;
  const d = new Date(Date.now() + st.rest/pace*7*864e5);
  return `Bei deinem Tempo (${hrs(pace)} pro Woche) wärst du im <b>${d.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}</b> durch – wenn du nur noch Backlog spielst.`;
}
function renderBacklog(){
  const B = S.bl, all = blGames(), st = backlogStats();
  if (!all.length){ setView(`<div class="empty"><div class="big">📚</div><h2>Noch keine PC-Spiele</h2><p class="help">Verbinde Playnite oder Steam in den Einstellungen.</p></div>`); return; }
  const counts = {}; all.forEach(g=>counts[g.status]=(counts[g.status]||0)+1);
  const filters = [["open","Alles offen",st.open],["done","Geschafft",st.done], ...STATUS.map(s=>[s.k,`${s.e} ${s.l}`,counts[s.k]||0]).filter(x=>x[2])];
  setView(`${blurHead("PC-Backlog", `${st.open} offen`, `${st.done} durchgespielt · ${num(st.pct)} % geschafft`, blGames().find(g=>g.status==="als_naechstes") || blGames().filter(g=>g.status==="angefangen").sort((a,b)=>(b.last||0)-(a.last||0))[0] || blGames().filter(g=>SMAP[g.status].g==="open").sort((a,b)=>(b.critic||0)-(a.critic||0))[0])}
  <div class="bl-layout"><aside class="bl-aside">
    <section class="card violetc reveal"><div class="bhero">
      <div class="ring" style="--p:${st.pct}"><div><div><b>${num(st.pct)}%</b><br><span>geschafft</span></div></div></div>
      <div class="bhero nums"><div><b>${st.done}</b><span>durch</span></div><div><b>${st.unplayed}</b><span>nie gestartet</span></div>
        ${st.rest?`<div><b>${num(st.rest/60)}</b><span>Std Story offen</span></div>`:""}</div></div>
      <div style="opacity:.9;margin:14px 0 16px;font-size:14px">${forecast(st)}${st.rest&&st.known<st.open?` <span style="opacity:.75">(Spieldauer für ${st.known} von ${st.open} Spielen bekannt)</span>`:""}</div>
      <div class="inl" style="flex-wrap:wrap;gap:8px"><button class="btn" onclick="openPicker()">🎲 Würfeln</button><button class="btn ghost" onclick="openPlanner()">⏱ Abend planen</button></div></section>
    ${goalsCard()}
    <div class="bl-filters">${filters.map(([k,l,c])=>`<button class="chip ${B.f===k?"on":""}" onclick="S.bl.f='${k}';S.bl.limit=80;route()">${l}<small>${c}</small></button>`).join("")}</div>
  </aside><div>
    <div class="toolbar"><select id="bsort">${[["added","Am längsten im Regal"],["short","Kürzeste zuerst"],["last","Zuletzt gespielt"],["min","Meiste Spielzeit"],["name","Name A–Z"],["critic","Beste Fachpresse"],["rev","Beste Steam-Bewertung"]]
      .map(([k,l])=>`<option value="${k}" ${B.sort===k?"selected":""}>${l}</option>`).join("")}</select>
      <span class="help" style="margin:0">Gestrichelt = automatisch erkannt</span></div>
    <div class="bhead"><span></span><span>Spiel</span><span>Status</span><span>Gespielt</span><span>Dauer</span><span>Im Regal</span></div>
    <div id="blist"></div><div style="margin-top:18px">${historyCard()}</div></div></div>`);
  $("#bsort").onchange = e => { B.sort = e.target.value; blist(); };
  blist();

function blist(){
  const B = S.bl, far = new Date(8.64e15);
  const list = blGames().filter(g => B.f==="open" ? SMAP[g.status].g==="open" : B.f==="done" ? SMAP[g.status].g==="done" : g.status===B.f);
  list.sort({added:(a,b)=>(a.added||far)-(b.added||far), last:(a,b)=>(b.last||0)-(a.last||0), min:(a,b)=>b.pcMinutes-a.pcMinutes,
    name:(a,b)=>a.title.localeCompare(b.title,"de"), critic:(a,b)=>(b.critic||0)-(a.critic||0),
    rev:(a,b)=>((b.rev&&b.rev.total>=50)?b.rev.pct:0)-((a.rev&&a.rev.total>=50)?a.rev.pct:0),
    short:(a,b)=>(a.remaining??Infinity)-(b.remaining??Infinity)}[B.sort]);
  $("#blist").innerHTML = (list.slice(0,B.limit).map(g=>`<div class="brow" onclick="openGame('${esc(g.key)}')">
    <div class="poster">${img(g.covers,g.title)}</div>
    <div class="mid2"><b>${mcBadge(g.critic)}${esc(g.title)}</b><span>${[g.pcMinutes?hrs(g.pcMinutes):"nie gestartet", g.hltb&&g.hltb.main?`Dauer ${hrs(g.hltb.main)}`:"", g.rev?`Steam ${g.rev.pct} %`:"", g.genres.slice(0,2).join(", ")].filter(Boolean).join(" · ")}</span><div>${platChips(g)}</div></div>
    ${pill(g)}<span class="cd">${g.pcMinutes?hrs(g.pcMinutes):"–"}</span><span class="cd">${g.hltb&&g.hltb.main?hrs(g.hltb.main):"–"}</span><span class="cd">${g.added?g.added.getFullYear():"–"}</span></div>`).join("")
    || `<p class="help">Hier ist gerade nichts.</p>`)
    + (list.length > B.limit ? `<button class="btn ghost more" onclick="S.bl.limit+=150;blist()">Mehr anzeigen (${list.length-B.limit})</button>` : "");
}

/* ================= Aktivität ================= */
function renderActivity(head){
  const st = sessionStats(0);
  let h = head || "";
  if (!st.ss.length){
    setView(h + `<div class="card reveal empty-act"><div class="eyebrow">Session-Tracker</div><div class="mid" style="margin:8px 0">Sammelt gerade.</div>
      <p class="help">Sobald du spielst, erscheinen hier deine Sessions: Heatmap, Serien, Uhrzeiten und dein Gamer-Typ. PC-Spiele werden live erkannt, Konsolenzeit beim nächsten Abgleich.</p></div>`);
    return;
  }
  // Heatmap (53 Wochen)
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(today); start.setDate(today.getDate() - ((today.getDay()+6)%7) - 52*7);
  let cells = "", months = "", lastM = -1;
  for (let w=0; w<53; w++){
    const wd0 = new Date(start); wd0.setDate(start.getDate()+w*7);
    months += `<span>${wd0.getMonth()!==lastM && wd0.getDate()<=7 ? wd0.toLocaleDateString("de-DE",{month:"short"}).replace(".","") : ""}</span>`;
    if (wd0.getDate()<=7) lastM = wd0.getMonth();
    for (let d=0; d<7; d++){
      const x = new Date(start); x.setDate(start.getDate()+w*7+d);
      if (x > today){ cells += `<i class="x"></i>`; continue; }
      const dk = dayKey(x), m = st.perDay[dk]||0, mc = st.perDayC[dk]||0, l = m<=0?0:m<30?1:m<90?2:m<180?3:4;
      const cls = `l${l}${m && mc/m > .5 ? " co" : ""}${st.approxDay[dk] ? " ap" : ""}`;
      cells += `<i class="${cls}" title="${fdate(x)}: ${m?hrs(m):"nicht gespielt"}${mc?` (davon Konsole ${hrs(mc)})`:""}${st.approxDay[dk]?" · ungefähr":""}"></i>`;
    }
  }
  const year = st.days.filter(d=>d>=dayKey(new Date(Date.now()-365*864e5))).length;
  h += `<div class="stat3" style="margin-bottom:14px">
    <div class="tile reveal"><small>Aktuelle Serie</small><b>${st.curStreak} ${st.curStreak===1?"Tag":"Tage"}</b><span>${st.curStreak?"am Stück gezockt 🔥":"heute schon gespielt?"}</span></div>
    <div class="tile reveal"><small>Längste Serie</small><b>${st.best} Tage</b><span>Rekord</span></div>
    <div class="tile reveal"><small>Sessions</small><b>${num(st.ss.length)}</b><span>Ø ${hrs(st.avg)} lang</span></div>
    <div class="tile reveal"><small>Spieltage</small><b>${year}</b><span>in den letzten 12 Monaten</span></div></div>
  <div class="bento">
  <section class="card reveal"><h3>Dein Jahr in Kästchen</h3>
    <div class="heatwrap"><div class="months">${months}</div><div class="heat">${cells}</div></div>
    <div class="legend">weniger <i style="background:#ffffff0d"></i><i style="background:#33C3FF40"></i><i style="background:#33C3FF70"></i><i style="background:#33C3FFa8"></i><i style="background:#33C3FF"></i> mehr
      <span style="margin-left:14px"><i class="co l3" style="display:inline-block"></i> Konsole</span>
      <span style="margin-left:10px"><i class="ap l3" style="display:inline-block"></i> ungefähr</span></div>
    ${Object.keys(st.perDayC).length?`<p class="help">Konsolenzeit wird beim Abgleich erkannt. War der PC ein paar Tage aus, verteilen wir sie auf diese Tage – gestreifte Felder sind deshalb ungefähr. Wochen- und Monatssummen stimmen trotzdem.</p>`:""}</section>`;
  const hmx = Math.max(...st.hours, 1);
  h += `<section class="card violetc s7 reveal"><h3>Wann du spielst</h3>
    <div class="eyebrow" style="opacity:.8">Dein Typ</div><div class="mid" style="margin:4px 0 6px">${esc(st.type)}</div>
    <div style="font-weight:600;opacity:.9">${num(st.night*100)} % deiner Zeit zwischen 22 und 5 Uhr.</div>
    <div class="cols thin" style="height:150px">${st.hours.map((v,i)=>`<div class="c"><div style="height:0;background:#ffffffdd" data-h="${Math.max(2,v/hmx*100)}%"></div><span>${i%3===0?i:""}</span></div>`).join("")}</div></section>`;
  const wmx = Math.max(...st.wd, 1);
  h += `<section class="card yellowc s5 reveal"><h3>Wochentage</h3>
    <div class="mid">${st.weekend>.4?"Wochenend-Gamer":"Feierabend-Gamer"}</div><div style="font-weight:600;margin-top:4px">${num(st.weekend*100)} % am Wochenende.</div>
    <div class="cols" style="height:150px">${st.wd.map((v,i)=>`<div class="c"><div style="height:0;background:#1d1600" data-h="${Math.max(3,v/wmx*100)}%"></div><span>${WD[i]}</span></div>`).join("")}</div></section>`;
  if (st.longest){
    const g = S.gmap.get(st.longest[0]);
    h += `<section class="card topg s6 reveal" ${g?`onclick="openGame('${esc(g.key)}')"`:""}><div class="bgimg">${g?img(g.banners,g.title):ph(titleOf(st.longest[0]))}</div>
      <div class="in"><div class="eyebrow">Längste Session</div><div class="t">${hrs(st.longest[2]/60)}</div>
      <div>${esc(titleOf(st.longest[0]))} · ${fdate(new Date(st.longest[1]*1000))}</div></div></section>`;
  }
  const since30 = Date.now()/1000-30*86400, g30 = {};
  st.ss.filter(s=>s[1]>=since30).forEach(([k,,sec])=>g30[k]=(g30[k]||0)+sec/60);
  const top30 = Object.entries(g30).sort((a,b)=>b[1]-a[1]).slice(0,6);
  h += `<section class="card s6 reveal"><h3>Letzte 30 Tage</h3>${top30.length ? top30.map(([k,v])=>`<div class="pbar"><span class="nm" style="width:150px">${esc(titleOf(k))}</span>
    <span class="trk"><div style="width:0;background:var(--lime)" data-w="${v/top30[0][1]*100}%"></div></span><span class="v">${hrs(v)}</span></div>`).join("") : `<p class="help">Nichts gespielt.</p>`}</section>`;
  const cb = comebacks(), ya = yearAgo();
  if (ya.length) h += `<section class="card orangec s6 reveal"><h3>Heute vor einem Jahr</h3><div class="mid" style="font-size:clamp(28px,6vw,40px)">${esc(titleOf(ya[0][0]))}</div>
    <div style="font-weight:700;margin-top:6px">Um diese Zeit letztes Jahr hast du ${ya.map(([k,v])=>`${esc(titleOf(k))} (${hrs(v)})`).slice(0,3).join(", ")} gespielt.</div></section>`;
  if (cb.length) h += `<section class="card s6 reveal"><h3>Comebacks</h3>${cb.map(c=>`<div class="pbar"><span class="nm" style="width:auto;flex:1">🔁 ${esc(titleOf(c.k))}</span><span class="v" style="width:auto">nach ${num(c.gap/30)} Monaten</span></div>`).join("")}
    <p class="help">Spiele, zu denen du nach mindestens einem halben Jahr Pause zurückgekehrt bist.</p></section>`;
  const recent = st.ss.slice(-12).reverse();
  h += `<section class="card reveal"><h3>Letzte Sessions</h3>${recent.map(([k,s,sec,dev,ap])=>{ const g=S.gmap.get(k), d=new Date(s*1000);
    return `<div class="brow" style="grid-template-columns:52px 1fr auto" ${g?`onclick="openGame('${esc(k)}')"`:""}><div class="poster">${g?img(g.covers,g.title):ph(k)}</div>
      <div class="mid2"><b>${esc(titleOf(k))}</b><span>${d.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"})}${ap?" · ungefähr":`, ${d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} Uhr`} · <i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${pcolor(dev)}"></i> ${esc(dev)}</span></div>
      <div style="text-align:right"><b>${hrs(sec/60)}</b><button class="snb" onclick="event.stopPropagation();noteSession('${esc(k)}',${s})">${snoteIcon(k,s)}</button></div></div>`; }).join("")}
    <p class="help">Erfasst seit ${fdate(new Date(st.since*1000))}. PC live, Konsole beim Abgleich. Mit ✎ hältst du fest, wie die Session war.</p></section></div>`;
  setView(h);
}


/* ================= Tier-Liste ================= */
const TIER_MIN = 300; // erst ab 5 Stunden kann man ein Spiel einordnen
function renderTier(){
  const q = norm(S.lib.tq||"");
  const played = S.groups.filter(g=>g.minutes >= TIER_MIN).sort((a,b)=>b.minutes-a.minutes);
  const pool = played.filter(g=>!g.tier && (!q || g.key.includes(q)));
  const item = g => `<div class="titem" data-k="${esc(g.key)}" title="${esc(g.title)}"><div class="poster">${img(g.covers,g.title)}</div></div>`;
  setView(`${tierHead(S.groups.filter(g=>g.tier).length)}${libSeg()}
    <p class="help" style="margin-top:-6px">${matchMedia("(pointer:fine)").matches?"Cover in eine Reihe ziehen. Antippen öffnet das Spiel.":"Cover antippen und Rang wählen."}</p>
    ${TIERS.map(([t,c])=>`<div class="tierrow"><div class="tl" style="background:${c}">${t}</div><div class="tz" data-tier="${t}">${played.filter(g=>g.tier===t).map(item).join("")}</div></div>`).join("")}
    <div class="secttl" style="margin-top:20px">Noch nicht eingeordnet (${pool.length})</div>
    <div class="toolbar"><input id="tq" type="search" placeholder="Spiel suchen …" value="${esc(S.lib.tq||"")}"></div>
    <div class="tpool" data-tier="">${pool.slice(0, S.lib.tlimit||80).map(item).join("") || `<span class="help">Alles eingeordnet!</span>`}</div>
    ${pool.length > (S.lib.tlimit||80) ? `<button class="btn ghost more" onclick="S.lib.tlimit=(S.lib.tlimit||80)+120;renderTier()">Mehr anzeigen</button>`:""}`);
  $("#tq").oninput = e => { S.lib.tq = e.target.value; const pos = e.target.selectionStart; renderTier(); const el=$("#tq"); el.focus(); el.setSelectionRange(pos,pos); };
  document.querySelectorAll(".titem").forEach(el => {
    el.ondragstart = e => e.preventDefault();
    el.onpointerdown = e => {
      if (e.button !== 0) return;
      const sx = e.clientX, sy = e.clientY, mouse = e.pointerType === "mouse";
      let ghost = null, zone = null, moved = false;
      const move = ev => {
        if (Math.hypot(ev.clientX-sx, ev.clientY-sy) > 10) moved = true;
        if (!ghost){
          if (!mouse || Math.hypot(ev.clientX-sx, ev.clientY-sy) < 6) return;
          ghost = el.cloneNode(true); el.style.opacity = ".3";
          ghost.style.cssText = `position:fixed;z-index:200;pointer-events:none;width:${el.offsetWidth}px;transform:rotate(-4deg) scale(1.08);filter:drop-shadow(0 12px 24px #000a)`;
          document.body.appendChild(ghost);
        }
        ghost.style.left = (ev.clientX - el.offsetWidth/2) + "px"; ghost.style.top = (ev.clientY - el.offsetHeight/2) + "px";
        const z = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".tz,.tpool");
        if (z !== zone){ zone && zone.classList.remove("over"); zone = z; zone && zone.classList.add("over"); }
      };
      const up = ev => {
        removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
        // Beim Scrollen am Handy kommt "pointercancel" – das ist kein Antippen
        if (!ghost){ if (ev.type === "pointerup" && !moved) tierPick(el.dataset.k); return; }
        ghost.remove(); el.style.opacity = ""; zone && zone.classList.remove("over");
        if (zone && (zone.dataset.tier || null) !== (S.gmap.get(el.dataset.k).tier || null)) setTier(el.dataset.k, zone.dataset.tier || null, false);
      };
      addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
    };
  });
}

const STOP = new Set(["the","of","a","an","and","s","der","die","das","edition","game","games","tom"]);
function franchiseKey(g){
  const t = g.key.split(" ").filter(w => w.length > 1 && !STOP.has(w));
  if (!t.length) return null;
  if (t.length === 1 || /^(\d+|[ivx]+)$/.test(t[1])) return t[0].length >= 4 ? t[0] : null;
  return t[0] + " " + t[1];
}
function franchises(list, val){
  const m = new Map();
  for (const g of list){ const k = franchiseKey(g); if (!k) continue; const e = m.get(k) || {k, games:[], minutes:0}; e.games.push(g); e.minutes += val(g); m.set(k, e); }
  const out = [...m.values()].filter(f => f.games.length >= 2);
  for (const f of out){
    // Anzeigename: gemeinsamer Wort-Anfang der Originaltitel
    const words = f.games.map(g => g.title.replace(/[™®©]/g,"").split(/\s+/));
    let n = 0; while (words.every(w => w[n] && w[n].toLowerCase().replace(/[:\-–]$/,"") === words[0][n].toLowerCase().replace(/[:\-–]$/,""))) n++;
    f.name = n ? words[0].slice(0, n).join(" ").replace(/[:\-–]$/,"") : f.games[0].title;
  }
  return out.sort((a,b)=>b.minutes-a.minutes);
}

      <div style="font-size:12.5px;opacity:.8;margin-top:4px">${good ? (v>=t?"🎉 Geschafft!":onTrack?"Im Plan":"Etwas hinter dem Plan") : (v>t?"Ziel gerissen 🙈":onTrack?"Im Rahmen":"Über dem Plan")}</div></div>`;
  };
  return `<section class="card cyanc reveal"><h3>Jahresziel ${y}</h3>
    ${g.done ? bar("Durchgespielt", done, g.done, true) : `<div style="font-weight:700;margin-bottom:6px">${done} Spiele durchgespielt</div>`}
    ${g.max_new ? bar("Neue Spiele", added, g.max_new, false) : `<div style="font-weight:700;margin-bottom:6px">${added} neue Spiele in der Bibliothek</div>`}

      <label style="color:inherit">Höchstens neue Spiele kaufen</label><input type="number" id="gNew" min="1" max="500" value="${g.max_new||""}" style="width:100%;background:#00000018;color:#04201d;border-color:#00000030">
      <button class="btn small" style="margin-top:10px;background:#04201d;color:var(--cyan)" onclick="saveGoals()">Speichern</button></details></section>`;

function historyCard(){
  const months = [], now = new Date();
  for (let i=11;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push([d.getFullYear(), d.getMonth()]); }
  const key = (y,m) => `${y}-${String(m+1).padStart(2,"0")}`;
  const add = {}, done = {}, seen = new Set();
  for (const g of blGames()) if (g.added) { const k = key(g.added.getFullYear(), g.added.getMonth()); add[k]=(add[k]||0)+1; }
  for (const [k, st, at] of S.data.status_log||[]) if (DONE.has(st) && !seen.has(k)){ seen.add(k); const m = String(at).slice(0,7); done[m]=(done[m]||0)+1; }
  const mx = Math.max(1, ...months.map(([y,m])=>Math.max(add[key(y,m)]||0, done[key(y,m)]||0)));
  const ta = months.reduce((s,[y,m])=>s+(add[key(y,m)]||0),0), td = months.reduce((s,[y,m])=>s+(done[key(y,m)]||0),0);

function comebacks(){
  const by = {}; for (const s of allSessions()) (by[s[0]] = by[s[0]] || []).push(s);
  const out = [];
  for (const [k, ss] of Object.entries(by)) for (let i=1;i<ss.length;i++){ const gap = (ss[i][1]-ss[i-1][1])/86400; if (gap >= 180) out.push({k, gap, at: ss[i][1]}); }
  return out.sort((a,b)=>b.at-a.at).slice(0,5);
}
function yearAgo(){
  const t = Date.now()/1000 - 365*86400;
  const per = {}; for (const [k,s,sec] of allSessions()) if (Math.abs(s - t) < 3.5*86400) per[k]=(per[k]||0)+sec/60;
  return Object.entries(per).sort((a,b)=>b[1]-a[1]);
}

function confetti(){
  const st = $("#wstage"); if (!st) return;
